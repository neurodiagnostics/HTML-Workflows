<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICHD-3 Headache Classification · Diagnostic Navigator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&family=Lexend:wght@300;400;500;600&display=swap');

:root {
  --bg:        #0d1117;
  --card:      #161b22;
  --card2:     #1c2330;
  --border:    #3a4556;
  --border2:   #4a5f7a;
  --green:     #3fb950;
  --green-bg:  rgba(63,185,80,0.10);
  --green-bd:  rgba(63,185,80,0.35);
  --red:       #f85149;
  --red-bg:    rgba(248,81,73,0.10);
  --red-bd:    rgba(248,81,73,0.35);
  --amber:     #e3b341;
  --amber-bg:  rgba(227,179,65,0.10);
  --amber-bd:  rgba(227,179,65,0.35);
  --blue:      #58a6ff;
  --blue-bg:   rgba(88,166,255,0.10);
  --blue-bd:   rgba(88,166,255,0.35);
  --purple:    #bc8cff;
  --purple-bg: rgba(188,140,255,0.10);
  --purple-bd: rgba(188,140,255,0.35);
  --teal:      #2dd4bf;
  --teal-bg:   rgba(45,212,191,0.10);
  --teal-bd:   rgba(45,212,191,0.35);
  --text:      #e6edf3;
  --text2:     #aab4c0;
  --text3:     #6e7f94;
  --text-bright: #f0f5ff;
  --sans:  'Lexend', 'Inter', system-ui, sans-serif;
  --mono:  'IBM Plex Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow-x: hidden; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5; min-height: 100vh; overflow-x: hidden; }
.app { width: min(960px, 100%); margin: 0 auto; padding: 0 20px 80px; overflow-x: hidden; box-sizing: border-box; }

header { padding: 24px 0 16px; border-bottom: 1px solid var(--border); margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.h-title { font-size: 19px; font-weight: 700; }
.h-title span { color: var(--teal); }
.h-sub { font-family: var(--sans); font-size: 11px; color: var(--text3); margin-top: 3px; line-height: 1.5; }
.reset-btn { background: var(--card2); border: 1px solid var(--border); color: var(--text2); font-family: var(--sans); font-size: 12px; padding: 6px 14px; cursor: pointer; border-radius: 4px; transition: all 0.15s; white-space: nowrap; font-weight: 500; }
.reset-btn:hover { border-color: var(--teal); color: var(--teal); }

.prog-track { height: 3px; background: var(--border); margin-bottom: 6px; border-radius: 2px; }
.prog-fill { height: 100%; background: linear-gradient(90deg, var(--teal), #99f6e4); border-radius: 2px; transition: width 0.4s ease; box-shadow: 0 0 6px rgba(45,212,191,0.4); }
.prog-label { font-family: var(--sans); font-size: 10px; color: var(--text3); text-align: right; margin-bottom: 14px; letter-spacing: 0.04em; }

table.steps { width: 100%; border-collapse: collapse; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 20px; table-layout: fixed; background: var(--card); overflow: hidden; }
.steps .stab { display: table-cell !important; width: 33.333%; padding: 7px 4px 8px; text-align: center; font-family: var(--sans); font-size: 9px; color: var(--text3); background: var(--card); line-height: 1.2; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); transition: background 0.15s, color 0.15s; vertical-align: middle; }
.steps .steps-row:last-child .stab { border-bottom: none !important; }
.steps .steps-row .stab:last-child { border-right: none !important; }
.steps .stab .sn { display: block; width: 18px; height: 18px; line-height: 18px; border-radius: 50%; background: var(--card2); border: 1px solid var(--border); font-size: 9px; font-weight: 700; margin: 0 auto 3px; transition: all 0.2s; text-align: center; }
.steps .stab .slbl { display: block; font-size: 9px; font-weight: 600; letter-spacing: 0; line-height: 1.2; }
.steps .stab { cursor: pointer; }
.steps .stab:hover { background: var(--card2) !important; }
.steps .stab.active { color: var(--teal) !important; background: rgba(45,212,191,0.10) !important; }
.steps .stab.active .sn { background: var(--teal) !important; color: #0d1117 !important; border-color: var(--teal) !important; }
.steps .stab.done { color: var(--green) !important; }
.steps .stab.done .sn { background: var(--green) !important; color: #0d1117 !important; border-color: var(--green) !important; }
.steps .stab.up { opacity: 0.5; }
.steps .stab.up:hover { opacity: 0.85; }
.steps .stab.skip { opacity: 0.6; }
.steps .stab.skip .sn { border-style: dashed; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 22px; margin-bottom: 12px; overflow: hidden; box-sizing: border-box; width: 100%; animation: fu 0.25s ease; }
.ctitle { font-size: 13px; font-weight: 700; font-family: var(--sans); letter-spacing: 0; text-transform: none; margin-bottom: 3px; color: var(--teal); }
.csub { font-size: 12px; color: var(--text2); margin-bottom: 16px; line-height: 1.5; }

.slabel { display: flex; align-items: center; gap: 8px; font-family: var(--sans); font-size: 12px; font-weight: 600; color: var(--text); letter-spacing: 0; text-transform: none; margin-bottom: 9px; padding-bottom: 6px; border-bottom: 1px solid var(--border); line-height: 1.4; }
.pill { font-size: 9px; padding: 1px 7px; border-radius: 20px; border: 1px solid; margin-left: auto; flex-shrink: 0; font-family: var(--sans); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
.pill-r { border-color: var(--red);    color: var(--red);    background: var(--red-bg); }
.pill-a { border-color: var(--amber);  color: var(--amber);  background: var(--amber-bg); }
.pill-t { border-color: var(--teal);   color: var(--teal);   background: var(--teal-bg); }
.pill-g { border-color: var(--green);  color: var(--green);  background: var(--green-bg); }
.pill-b { border-color: var(--blue);   color: var(--blue);   background: var(--blue-bg); }

/* Evidence disclosure (the "details" button system) */
.crit { border: 1px solid var(--border); border-radius: 6px; margin-bottom: 14px; overflow: hidden; width: 100%; box-sizing: border-box; min-width: 0; }
.crit.c-ev { border-color: var(--teal-bd); background: var(--teal-bg); }
.crit-main { display: flex; align-items: center; gap: 10px; padding: 10px 13px; }
.crit-name { flex: 1; font-size: 12px; font-weight: 600; color: var(--text); line-height: 1.3; }
.xbtn { background: var(--purple-bg); border: 1px solid var(--purple-bd); color: var(--purple); font-size: 11px; cursor: pointer; padding: 2px 8px; font-family: var(--sans); white-space: nowrap; transition: all 0.15s; flex-shrink: 0; border-radius: 3px; font-weight: 500; }
.xbtn:hover { background: var(--purple); color: #0d1117; border-color: var(--purple); }
.crit-detail { display: none; padding: 11px 13px 13px; font-size: 12px; color: var(--text); line-height: 1.7; border-top: 1px solid var(--border); overflow-wrap: break-word; word-break: break-word; }
.crit-detail.open { display: block; }
.crit-detail .lt { color: var(--teal); font-weight: 600; }
.crit-detail .la { color: var(--amber); font-weight: 600; }
.crit-detail .lr { color: var(--red); font-weight: 600; }
.crit-detail .lg { color: var(--green); font-weight: 600; }
.crit-detail .lb { color: var(--blue); font-weight: 600; }
.cnote { margin-top: 9px; padding: 8px 11px; background: var(--card2); border-left: 3px solid var(--border2); font-family: var(--sans); font-size: 11px; color: var(--text2); line-height: 1.7; border-radius: 0 3px 3px 0; overflow-wrap: break-word; word-break: break-word; }
.cnote strong { color: var(--text); }

/* Colored explanation box */
.lbox { background: var(--card2); border: 1px solid var(--border); border-left: 3px solid var(--border2); border-radius: 5px; padding: 11px 14px; font-size: 12px; color: var(--text2); line-height: 1.65; margin-bottom: 14px; overflow-wrap: break-word; word-break: break-word; }
.lbox.warn { border-left-color: var(--amber); }
.lbox.danger { border-left-color: var(--red); }
.lbox.info { border-left-color: var(--teal); }
.lbox strong { color: var(--text); }

/* Option stack (radio + checkbox) */
.opt-stack { display: flex; flex-direction: column; gap: 7px; }
.opt-btn { display: flex; align-items: flex-start; gap: 11px; width: 100%; text-align: left; background: var(--card2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: var(--sans); font-size: 13px; font-weight: 400; padding: 11px 13px; cursor: pointer; transition: all 0.13s; line-height: 1.4; }
.opt-btn:hover { border-color: var(--border2); background: #232c3b; }
.opt-btn.sel { border-color: var(--teal); background: var(--teal-bg); }
.opt-box { width: 16px; height: 16px; min-width: 16px; margin-top: 1px; border: 1px solid var(--border2); background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 10px; color: #0d1117; flex-shrink: 0; transition: all 0.13s; }
.opt-box.radio { border-radius: 50%; }
.opt-box.check { border-radius: 4px; }
.opt-btn.sel .opt-box { background: var(--teal); border-color: var(--teal); }
.opt-box .dot { width: 6px; height: 6px; border-radius: 50%; background: #0d1117; display: none; }
.opt-btn.sel .opt-box.radio .dot { display: block; }
.opt-hint { font-family: var(--sans); font-size: 11px; color: var(--text3); margin-top: 9px; font-style: italic; }

/* Navigation */
.nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; gap: 10px; }
.nbtn { padding: 9px 22px; border-radius: 5px; font-family: var(--sans); font-size: 13px; letter-spacing: 0; text-transform: none; border: 1px solid; cursor: pointer; font-weight: 600; transition: all 0.15s; }
.np { background: var(--teal); border-color: var(--teal); color: #0d1117; font-weight: 700; }
.np:hover { background: #5eead4; border-color: #5eead4; }
.np:disabled { opacity: 0.3; cursor: not-allowed; }
.ns { background: transparent; border-color: var(--border2); color: var(--text2); }
.ns:hover { border-color: var(--text); color: var(--text); }
.nspacer { flex: 1; }

@keyframes fu { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }

/* Verdict banner */
.vban { border-radius: 8px; padding: 20px 24px; margin-bottom: 14px; border: 2px solid; animation: fu 0.3s ease; }
.vban-head { text-align: center; margin-bottom: 12px; }
.vlbl { font-family: var(--sans); font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.65; margin-bottom: 5px; }
.vtitle { font-size: 20px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.01em; font-family: var(--sans); line-height: 1.25; }
.vdesc { font-size: 12px; color: var(--text2); line-height: 1.7; max-width: 720px; margin: 0 auto; }
.vconf { display: inline-block; font-family: var(--mono); font-size: 10px; padding: 2px 10px; border-radius: 12px; border: 1px solid; margin-bottom: 8px; letter-spacing: 0.03em; }
.conf-g { border-color: var(--green-bd);  color: var(--green);  background: var(--green-bg); }
.conf-a { border-color: var(--amber-bd);  color: var(--amber);  background: var(--amber-bg); }
.conf-r { border-color: var(--red-bd);    color: var(--red);    background: var(--red-bg); }
.conf-b { border-color: var(--blue-bd);   color: var(--blue);   background: var(--blue-bg); }
.conf-t { border-color: var(--teal-bd);   color: var(--teal);   background: var(--teal-bg); }
.conf-p { border-color: var(--purple-bd); color: var(--purple); background: var(--purple-bg); }
.vban ul { margin: 8px 0 0 18px; padding: 0; }
.vban li { margin-bottom: 5px; line-height: 1.55; }
.vban strong { color: var(--text); }

/* Diagnostic criteria table */
.dx-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; margin-bottom: 12px; }
.dx-row { display: flex; gap: 12px; align-items: flex-start; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
.dx-row:last-child { border-bottom: none; }
.dx-key { flex: 0 0 148px; color: var(--text3); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; padding-top: 1px; }
.dx-val { flex: 1; color: var(--text); line-height: 1.5; }
@media (max-width: 560px) { .dx-row { flex-direction: column; gap: 3px; } .dx-key { flex: none; } }

/* Documentation note */
.doc-header { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.doc-tog { flex: 1; text-align: left; background: var(--card2); border: 1px solid var(--border2); border-radius: 5px; color: var(--text2); font-family: var(--sans); font-size: 12px; padding: 8px 13px; cursor: pointer; transition: all 0.15s; }
.doc-tog:hover { border-color: var(--teal); color: var(--teal); }
.copy-btn { background: var(--card2); border: 1px solid var(--border2); border-radius: 5px; color: var(--text2); font-family: var(--sans); font-size: 12px; padding: 8px 14px; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
.copy-btn:hover { border-color: var(--green); color: var(--green); }
.copy-btn.copied { border-color: var(--green); color: var(--green); background: var(--green-bg); }
.doc-body { display: none; background: var(--card2); border: 1px solid var(--border2); border-radius: 5px; padding: 13px 15px; font-family: var(--mono); font-size: 11px; color: var(--text2); line-height: 1.8; white-space: pre-wrap; word-break: break-word; margin-bottom: 12px; }
.doc-body.open { display: block; }

.ref-section { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); font-family: var(--sans); font-size: 10px; color: var(--text3); line-height: 1.8; }
.ref-section .disc { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); color: var(--red); font-family: var(--mono); font-size: 10px; line-height: 1.6; }
</style>
</head>
<body>
<div class="app">

<header>
  <div>
    <div class="h-title">ICHD-3 Headache Classification · <span>Diagnostic Navigator</span></div>
    <div class="h-sub">International Classification of Headache Disorders, 3rd edition &middot; Stepwise primary-headache classification<br>
    For clinician educator use only<br>
    Designed by Daniel Short, MD</div>
  </div>
  <button class="reset-btn" onclick="restart()">&#8635; Reset</button>
</header>

<div class="prog-track"><div class="prog-fill" id="pFill" style="width:0%"></div></div>
<div class="prog-label" id="pLabel">Step 1 of 4</div>

<div id="steptabs"></div>

<div id="main"></div>
</div><!-- close .app -->

<script>
// ═══════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════
var S = { phase: 'red_flags', answers: {}, trail: [] };

function advance(to) { S.trail.push(S.phase); S.phase = to; render(); }
function back() { if (S.trail.length) { S.phase = S.trail.pop(); render(); } }
function restart() { S = { phase: 'red_flags', answers: {}, trail: [] }; render(); window.scrollTo({ top: 0, behavior: 'instant' }); }
window.back = back;
window.restart = restart;

// ═══════════════════════════════════════════════
//  STEP-TAB BACKBONE
// ═══════════════════════════════════════════════
var TABS = [
  { key: 'red_flags',       label: 'Safety Screen' },
  { key: 'characteristics', label: 'Headache Characteristics' },
  { key: 'moa',             label: 'Medication Use' },
  { key: 'result',          label: 'ICHD-3 Verdict' }
];

function tabIndex(key) { for (var i = 0; i < TABS.length; i++) { if (TABS[i].key === key) return i; } return -1; }

// Any step tab is clickable — jump directly to that phase.
// The trail is rebuilt as all phases preceding the target so Back and
// the done / active states stay coherent.
window.goTab = function (key) {
  if (key === S.phase) return;
  var order = TABS.map(function (t) { return t.key; });
  var idx = order.indexOf(key);
  if (idx < 0) return;
  S.trail = order.slice(0, idx);
  S.phase = key;
  render();
};
window.goPhase = window.goTab; // backward-compatible alias

function renderSteps() {
  var curIdx = tabIndex(S.phase);
  var w = (100 / TABS.length).toFixed(4);
  var html = '<table class="steps" role="navigation"><tr class="steps-row">';
  TABS.forEach(function (t, i) {
    var cls = 'stab';
    if (t.key === S.phase) cls += ' active';
    else if (S.trail.indexOf(t.key) >= 0) cls += ' done';
    else if (i < curIdx) cls += ' skip';   // an earlier step that was branched past
    else cls += ' up';                     // not yet reached
    // every tab is clickable
    html += '<td class="' + cls + '" style="width:' + w + '%" onclick="goTab(\'' + t.key + '\')">'
      + '<span class="sn">' + (i + 1) + '</span><span class="slbl">' + t.label + '</span></td>';
  });
  html += '</tr></table>';
  document.getElementById('steptabs').innerHTML = html;
}

// ═══════════════════════════════════════════════
//  PROGRESS
// ═══════════════════════════════════════════════
function updateProgress() {
  var i = tabIndex(S.phase);
  var pctv = i < 0 ? 100 : Math.round((i / (TABS.length - 1)) * 100);
  document.getElementById('pFill').style.width = pctv + '%';
  document.getElementById('pLabel').textContent =
    S.phase === 'result' ? 'ICHD-3 Verdict' : ('Step ' + (i + 1) + ' of ' + TABS.length);
}

// ═══════════════════════════════════════════════
//  EVIDENCE PANELS  (primary source: ICHD-3, Cephalalgia 2018;38(1):1–211)
//  These populate the expandable "details" buttons on every step.
// ═══════════════════════════════════════════════
var EVIDENCE = {
  red_flags: {
    btn: 'SNNOOP10 red-flag framework',
    body: 'Red-flag features signal possible <strong>secondary</strong> headache (ICHD-3 Part Two) and should be excluded before a primary-headache code is assigned. The <span class="lr">SNNOOP10</span> list (Do TP et al., Neurology 2019) systematizes them: <strong>S</strong>ystemic symptoms including fever; <strong>N</strong>eoplasm history; <strong>N</strong>eurologic deficit or dysfunction (incl. reduced consciousness); <strong>O</strong>nset sudden/thunderclap; <strong>O</strong>lder age at onset (&gt;50); <strong>P</strong>attern change or recent new headache; <strong>P</strong>ositional headache; <strong>P</strong>recipitated by Valsalva (sneeze, cough, exertion); <strong>P</strong>apilledema; <strong>P</strong>rogressive/atypical presentation; <strong>P</strong>regnancy or puerperium; <strong>P</strong>ainful eye with autonomic features; <strong>P</strong>ost-traumatic onset; <strong>P</strong>athology of the immune system (e.g., HIV); <strong>P</strong>ainkiller overuse or new drug at onset.',
    note: '<strong>Ref:</strong> Do TP et al. Red and orange flags for secondary headaches. <em>Neurology</em> 2019;92:134–144. ICHD-3, <em>Cephalalgia</em> 2018;38(1):1–211 (Part Two).'
  },
  onset: {
    btn: 'ICHD-3 onset criteria',
    body: '<span class="lr">Primary thunderclap headache (4.4):</span> high-intensity headache of <strong>abrupt onset, reaching maximum in &lt;1 minute</strong> and lasting ≥5 minutes — a diagnosis of exclusion only after SAH, RCVS, CVST, and dissection are ruled out.<br><br><span class="lt">New daily persistent headache (4.10):</span> a persistent headache that is <strong>daily from onset</strong> (becoming continuous/unremitting within 24 h), clearly recalled by the patient, and present for &gt;3 months.',
    note: '<strong>Ref:</strong> ICHD-3 4.4, 4.10.'
  },
  pattern: {
    btn: 'Episodic vs chronic definitions',
    body: 'ICHD-3 uses a <span class="la">≥15 days/month for &gt;3 months</span> threshold to define the chronic forms (chronic migraine 1.3, chronic TTH 2.3, chronic cluster 3.1.2). Discrete attacks with complete freedom between episodes characterize episodic disorders. A relapsing–remitting <strong>bout</strong> pattern — active periods of weeks separated by months of remission — is characteristic of episodic cluster headache (3.1.1).',
    note: '<strong>Ref:</strong> ICHD-3 1.3, 2.3, 3.1.'
  },
  duration: {
    btn: 'Attack-duration discriminators',
    body: 'Untreated attack duration is one of the strongest ICHD-3 discriminators:<br>• <span class="lt">Primary stabbing (4.7)</span> — up to a few seconds<br>• <span class="lt">Trigeminal neuralgia (13.1.1)</span> — a fraction of a second to 2 min<br>• <span class="lt">SUNCT / SUNA (3.3)</span> — 1–600 s<br>• <span class="lt">Paroxysmal hemicrania (3.2)</span> — 2–30 min<br>• <span class="lt">Cluster (3.1)</span> — 15–180 min<br>• <span class="lt">Migraine (1.1)</span> — 4–72 h<br>• <span class="lt">Tension-type (2.x)</span> — 30 min to 7 days (or continuous when chronic)',
    note: '<strong>Ref:</strong> ICHD-3 sections 1, 2, 3, 4, 13.'
  },
  location: {
    btn: 'Location as a diagnostic clue',
    body: '<strong>Side-locked</strong> unilateral orbital / supraorbital / temporal pain defines the trigeminal autonomic cephalalgias (3.x) and hemicrania continua (3.4). Migraine (1.1) is unilateral in ~60% and may alternate sides between attacks. Tension-type headache (2.x) is characteristically <strong>bilateral</strong>. A small, coin-shaped fixed scalp area suggests nummular headache (4.9); pain in a cranial-nerve distribution suggests a neuralgia (13.x).',
    note: '<strong>Ref:</strong> ICHD-3 1.1 (crit C), 2.x (crit C), 3.x, 4.9, 13.x.'
  },
  quality: {
    btn: 'Pain-quality criteria',
    body: '<span class="lt">Pulsating</span> quality is one of migraine\u2019s four criterion-C features (1.1). <span class="lt">Pressing / tightening</span> (non-pulsating, band-like) quality is a defining tension-type feature (2.x crit C). <span class="lt">Electric-shock / stabbing</span> pain along a nerve distribution characterizes trigeminal neuralgia (13.1.1) and primary stabbing headache (4.7). Severe <span class="lt">boring</span> periorbital pain is typical of cluster and the other TACs.',
    note: '<strong>Ref:</strong> ICHD-3 1.1, 2.x, 4.7, 13.1.1, 3.1.'
  },
  intensity: {
    btn: 'Severity within ICHD-3 criteria',

function evidenceBlock(key) {
  var e = EVIDENCE[key];
  if (!e) return '';
  return '<div class="crit c-ev">'
    + '<div class="crit-main">'
    + '<div class="crit-name">Evidence &amp; ICHD-3 criteria behind this step</div>'

// Toggle an evidence panel open/closed
window.xp = function (btn) {
  var detail = btn.closest('.crit').querySelector('.crit-detail');
  if (!detail) return;
  var open = detail.classList.toggle('open');
  btn.innerHTML = open ? btn.innerHTML.replace('▾', '▴') : btn.innerHTML.replace('▴', '▾');

function backBtn() {

// ── Radio step ──────────────────────────────────
function radioStep(label, q, note, noteClass, key, opts, contLabel, onCont) {
  var cur = S.answers[key];
  var h = '<div class="card">';
  h += '<div class="ctitle">' + label + '</div>';
  h += '<div class="csub">' + q + '</div>';
  if (note) h += '<div class="lbox' + (noteClass ? ' ' + noteClass : '') + '">' + note + '</div>';
  h += evidenceBlock(key);
  h += '<div class="slabel">Select one <span class="pill pill-r">Required</span></div>';
  h += '<div class="opt-stack" id="ropts_' + key + '">';
  opts.forEach(function (o, i) {
    var s = cur === o.val ? ' sel' : '';
    h += '<button class="opt-btn' + s + '" onclick="pickR(\'' + key + '\',\'' + o.val + '\',' + i + ')">'
      + '<span class="opt-box radio"><span class="dot"></span></span>'
      + '<span>' + o.label + '</span></button>';
  });
  h += '</div>';
  h += '<div class="nav-row">' + backBtn()
    + '<button class="nbtn np" id="rgo_' + key + '" onclick="radioGo(\'' + key + '\')" ' + (cur ? '' : 'disabled') + '>' + (contLabel || 'Continue') + ' &rarr;</button>'
    + '</div>';
  h += '</div>';
  window._rcb = window._rcb || {}; window._rcb[key] = onCont;
  return h;
}
window.pickR = function (k, v, i) {
  S.answers[k] = v;
  var c = document.getElementById('ropts_' + k);
  if (c) { c.querySelectorAll('.opt-btn').forEach(function (b) { b.classList.remove('sel'); }); c.querySelectorAll('.opt-btn')[i].classList.add('sel'); }
  var b = document.getElementById('rgo_' + k); if (b) b.removeAttribute('disabled');
  if (S.phase === 'characteristics') updateCharContinue();   // in-place; no re-render / no scroll
};
window.radioGo = function (k) { var v = S.answers[k]; if (!v) return; var cb = (window._rcb || {})[k]; if (cb) cb(v); };

// ── Checkbox step ──────────────────────────────
function checkStep(label, q, note, noteClass, key, opts, contLabel, onCont) {
  var sel = S.answers[key] || [];
  var h = '<div class="card">';
  h += '<div class="ctitle">' + label + '</div>';
  h += '<div class="csub">' + q + '</div>';
  if (note) h += '<div class="lbox' + (noteClass ? ' ' + noteClass : '') + '">' + note + '</div>';
  h += evidenceBlock(key);
  h += '<div class="slabel">Select all that apply <span class="pill pill-a">Multi-select</span></div>';
  h += '<div class="opt-stack" id="copts_' + key + '">';
  opts.forEach(function (o) {
    var c = sel.indexOf(o.val) >= 0 ? ' sel' : '';
    h += '<button class="opt-btn' + c + '" data-val="' + o.val + '" onclick="togC(\'' + key + '\',\'' + o.val + '\')">'
      + '<span class="opt-box check">' + (sel.indexOf(o.val) >= 0 ? '&#10003;' : '') + '</span>'
      + '<span>' + o.label + '</span></button>';
  });
  h += '</div>';
  h += '<div class="nav-row">' + backBtn()
    + '<button class="nbtn np" onclick="checkGo(\'' + key + '\')">' + (contLabel || 'Continue') + ' &rarr;</button>'
    + '</div>';
  h += '</div>';
  window._ccb = window._ccb || {}; window._ccb[key] = onCont;
  return h;
}
window.togC = function (k, v) {
  if (!S.answers[k]) S.answers[k] = [];
  var arr = S.answers[k], i = arr.indexOf(v);
  // "none" style options are mutually exclusive with the rest
  var noneVals = ['none', 'none_assoc', 'none_auto'];
  if (i >= 0) { arr.splice(i, 1); }
  else {
    if (noneVals.indexOf(v) >= 0) { S.answers[k] = [v]; }
    else { arr.push(v); noneVals.forEach(function (nv) { var j = S.answers[k].indexOf(nv); if (j >= 0) S.answers[k].splice(j, 1); }); }
  }
  syncChecks(k);                                            // update boxes in place — no re-render, page does not jump
  if (S.phase === 'characteristics') updateCharContinue();
};
// Re-sync every checkbox button in a group to the current answer array (in place)
function syncChecks(k) {
  var cont = document.getElementById('copts_' + k);
  if (!cont) return;
  var sel = S.answers[k] || [];
  cont.querySelectorAll('.opt-btn').forEach(function (b) {
    var val = b.getAttribute('data-val');
    var on = sel.indexOf(val) >= 0;
    b.classList.toggle('sel', on);
    var box = b.querySelector('.opt-box.check');
    if (box) box.innerHTML = on ? '\u2713' : '';
  });
}
window.checkGo = function (k) { var cb = (window._ccb || {})[k]; if (cb) cb(S.answers[k] || []); };

function render() {
  updateProgress();
  renderSteps();
  var m = document.getElementById('main');
  switch (S.phase) {
    case 'red_flags':       m.innerHTML = renderRedFlags(); break;
    case 'characteristics': m.innerHTML = renderCharacteristics(); break;
    case 'moa':             m.innerHTML = renderMOA(); break;
    case 'result':          renderResult(m); break;
    default:                m.innerHTML = '<p>Unknown phase</p>';
  }
  if (S.phase === 'characteristics') updateCharContinue();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

// Required-field gate for the combined step.
// A sudden-onset (thunderclap) or daily-from-onset (NDPH) answer short-circuits
// the classification, so the remaining fields are not required in those cases.
function charReady() {
  var a = S.answers;
  if (!a.onset) return false;
  if (a.onset === 'sudden' || a.onset === 'chronic_new') return true;
  return !!(a.pattern && a.freq && a.duration && a.location && a.quality && a.intensity && a.aura);
}

function updateCharContinue() {
  var btn = document.getElementById('charCont');
  if (!btn) return;
  var hint = document.getElementById('charHint');
  var ready = charReady();
  btn.disabled = !ready;
  if (!hint) return;
  if (ready) { hint.style.display = 'none'; hint.textContent = ''; return; }
  var a = S.answers, miss = [];
  if (!a.onset) miss.push('onset');
  else if (a.onset !== 'sudden' && a.onset !== 'chronic_new') {
    if (!a.pattern) miss.push('temporal pattern');
    if (!a.freq) miss.push('frequency');
    if (!a.duration) miss.push('attack duration');
    if (!a.location) miss.push('location');
    if (!a.quality) miss.push('pain quality');
    if (!a.intensity) miss.push('severity');
    if (!a.aura) miss.push('aura');
  }
  hint.style.display = 'block';
  hint.textContent = 'Complete before continuing — remaining: ' + miss.join(', ') + '.';
}

    + '</div>';
  return h;
}

// ── MEDICATION OVERUSE ─────────────────────────
function renderMOA() {
  return radioStep('Step 3 &middot; Medication Use', 'Is the patient taking acute headache medications regularly?',
    'Medication-overuse headache (MOH) requires headache on ≥15 days/month plus regular intake of acute medications: triptans/ergotamine ≥10 days/month, or simple analgesics/NSAIDs ≥15 days/month (for ≥3 months).', 'warn',
    'moa', [
      { val: 'triptan_overuse', label: 'Triptans or ergotamine used on ≥10 days/month for >3 months' },
      { val: 'analgesic_overuse', label: 'Simple analgesics or NSAIDs used on ≥15 days/month for >3 months' },
      { val: 'opioid_overuse', label: 'Opioids or combination analgesics used on ≥10 days/month for >3 months' },
      { val: 'no_overuse', label: 'No overuse — acute medications used within recommended limits' }
    ], 'See ICHD-3 Verdict', function (v) {
      S.answers.moa = v;
      advance('result');
    });
}

// ═══════════════════════════════════════════════
//  RESULT ENGINE  (diagnostic logic preserved)
// ═══════════════════════════════════════════════
function renderResult(m) {
  var a = S.answers;
  var html = '';

  // ── 1. RED FLAGS → SECONDARY WORKUP ────────
  var rf = a.red_flags || [];
  var danger = rf.filter(function (v) { return v !== 'none'; });
  if (danger.length > 0) {
    var rfLabels = {
      thunderclap: 'Thunderclap onset → SAH until proven otherwise — CT head stat, LP if CT negative',
      progressive: 'Progressive headache → mass lesion, IIH, subdural — neuroimaging required',
      fever: 'Fever/meningismus → meningitis/encephalitis — LP urgently if no contraindication',
      neuro: 'New focal neurological deficit → stroke, mass, CVST — neuroimaging stat',
      papilledema: 'Papilledema → raised ICP — neuroimaging, fundoscopy',
      age50: 'New headache age >50 → GCA, mass — ESR/CRP, neuroimaging',
      positional: 'Positional/Valsalva headache → Chiari, ICP changes, colloid cyst — MRI brain',
      hiv: 'Immunocompromised → opportunistic infection, CNS lymphoma — MRI + LP',
      postpartum: 'Postpartum → CVST, posterior reversible encephalopathy — MRI/MRV'
    };
    var rflist = '<ul>';
    danger.forEach(function (v) { rflist += '<li>' + (rfLabels[v] || v) + '</li>'; });
    rflist += '</ul>';
    setDx('Secondary Headache — Red Flags Present', 'ICHD-3 Part Two', 'Red-flag features identified. Secondary causes must be excluded before applying primary-headache criteria.', []);
    html += verdictBanner('r-red', 'ICHD-3 Part Two — Urgent Workup', 'Red-Flag Features Present — Secondary Headache Must Be Excluded',
      '<strong>Identified red flags:</strong>' + rflist + '<strong>Do not apply primary-headache criteria until secondary causes are excluded.</strong>');
    html += docNoteCard();
    html += restartRow();
    html += disclaimer();
    m.innerHTML = html; return;
  }

  // ── 2. SUDDEN ONSET → THUNDERCLAP ──────────
  if (a.onset === 'sudden') {
    html += resultCard('r-red', 'Primary Thunderclap Headache — Diagnosis of Exclusion', 'ICHD-3 4.4',
      'Thunderclap-onset headache must first exclude subarachnoid haemorrhage (CT + LP), RCVS (MRA), CVST, and hypertensive emergency.',
      [{ k: 'Onset', v: 'Maximal intensity within 60 seconds' },
       { k: 'Exclusion', v: 'CT head → LP (xanthochromia) → MRA/MRV if both negative' },
       { k: 'Recurrence', v: 'Multiple thunderclap episodes — consider RCVS (6.7.3)' },
       { k: 'Note', v: 'Primary thunderclap headache is a diagnosis only after all secondary causes are excluded' }]);
    html += docNoteCard(); html += restartRow(); html += disclaimer();
    m.innerHTML = html; return;
  }

  // ── 3. CHRONIC_NEW ONSET → NDPH ────────────
  if (a.onset === 'chronic_new') {
    html += resultCard('r-purple', 'New Daily Persistent Headache', 'ICHD-3 4.10',
      'Headache that is daily and unremitting from onset (or within 3 days of onset), in a patient who can clearly recall the onset.',
      [{ k: 'Onset', v: 'Daily and unremitting from day 1 (or within 3 days)' },
       { k: 'Duration', v: 'Persistent for >3 months' },
       { k: 'Quality', v: 'May have migraine or tension-type features — does not exclude NDPH' },
       { k: 'Exclusion', v: 'Exclude secondary causes (IIH, CVST, meningitis) with MRI + LP' },
       { k: 'Prognosis', v: 'Often refractory; both self-limiting and persistent subtypes exist' }]);
    html += docNoteCard(); html += restartRow(); html += disclaimer();
    m.innerHTML = html; return;
  }

  var dur = a.duration, loc = a.location, qual = a.quality, inten = a.intensity;
  var assoc = a.assoc || [], auto = a.autonomic || [], aur = a.aura, freq = a.freq, chron = a.chronicity, moa = a.moa;
  var hasAuto = auto.filter(function (v) { return v !== 'none_auto'; }).length > 0;
  var hasNausea = assoc.indexOf('nausea') >= 0;
  var hasPhoto = assoc.indexOf('photo') >= 0;
  var hasPhono = assoc.indexOf('phono') >= 0;
  var hasAggravated = assoc.indexOf('aggravated_activity') >= 0;
  var isUnilateralOrbital = loc === 'unilateral_orbital';

  // ── 4. MEDICATION OVERUSE ───────────────────
  if (moa !== 'no_overuse' && (freq === 'ge15_month')) {
    html += resultCard('r-amber', 'Medication-Overuse Headache', 'ICHD-3 8.2',
      'Headache on ≥15 days/month, developing or worsening during medication overuse, in a patient with a pre-existing primary headache. The underlying primary headache should also be coded.',
      [{ k: 'Criteria', v: 'Headache ≥15 days/month + regular overuse for >3 months' },
       { k: 'Triptan/ergot', v: 'Overuse = ≥10 days/month' },
       { k: 'Analgesics/NSAIDs', v: 'Overuse = ≥15 days/month' },
       { k: 'Opioids/combos', v: 'Overuse = ≥10 days/month' },
       { k: 'Management', v: 'Medication withdrawal (may worsen initially); identify and treat underlying primary headache' },
       { k: 'Also code', v: 'Underlying primary headache (migraine, TTH) should be diagnosed separately' }]);
    html += '<div class="lbox" style="margin-bottom:14px;">Underlying primary-headache diagnosis also shown below:</div>';
  }

  // ── 5. VERY SHORT DURATION — NEURALGIAS / STABBING ──
  if (dur === 'seconds') {
    if (qual === 'stabbing' && !hasAuto) {
      html += resultCard('r-teal', 'Primary Stabbing Headache', 'ICHD-3 4.7',
        'Transient, strictly localized stabs of pain in the head lasting 1–10 seconds, occurring spontaneously.',
        [{ k: 'Duration', v: '1–10 seconds (single stabs or series)' },
         { k: 'Location', v: 'Variable, often temporal or parietal; may move between attacks' },
         { k: 'Frequency', v: 'Irregular, from daily to rare' },
         { k: 'Note', v: 'Exclude structural lesion if persistent at same fixed location' }]);
    } else if (qual === 'burning' || loc === 'face_jaw') {
      html += resultCard('r-amber', 'Trigeminal Neuralgia', 'ICHD-3 13.1.1',
        'Recurrent unilateral brief electric shock-like pains, abrupt in onset and termination, in the distribution of one or more divisions of the trigeminal nerve.',
        [{ k: 'Duration', v: 'A fraction of a second to 2 minutes' },
         { k: 'Quality', v: 'Electric shock-like, shooting, stabbing, or sharp — severe intensity' },
         { k: 'Location', v: 'V2 and/or V3 most common; V1 less often' },
         { k: 'Trigger', v: 'Often triggered by innocuous stimuli — chewing, talking, brushing teeth' },
         { k: 'Subtypes', v: 'Classical (NVC on MRI), Secondary (MS, mass), Idiopathic' },
         { k: 'Workup', v: 'MRI brain/trigeminal cistern to classify; MS screen if bilateral or young' }]);
    } else {
      html += resultCard('r-teal', 'Short-Duration Primary Headache — Consider Stabbing or Neuralgia', 'ICHD-3 4.7 / 13.x',
        'Very brief headaches (seconds) should be classified as stabbing headache or a cranial neuralgia based on quality, location, and triggers.',
        [{ k: 'Duration', v: 'Seconds' },
         { k: 'Next step', v: 'Assess for trigeminal distribution, triggers, and associated neurological symptoms' }]);
    }
    html += docNoteCard(); html += restartRow(); html += disclaimer();
    m.innerHTML = html; return;
  }

  // ── 6. TAC BRANCH ──────────────────────────
  if ((dur === 'min15_180' || dur === 'min5_30' || dur === 'min1_5') && isUnilateralOrbital && (inten === 'severe' || inten === 'very_severe')) {

    // SUNCT / SUNA: 1–600 sec, conjunctival injection required for SUNCT
    if (dur === 'min1_5') {
      var hasSUNCT = auto.indexOf('conjunctival') >= 0;
      if (hasSUNCT) {
        html += resultCard('r-amber', 'SUNCT', 'ICHD-3 3.3.1',
          'Short-lasting unilateral neuralgiform headache attacks with conjunctival injection and tearing.',
          [{ k: 'Duration', v: '1–600 seconds (usually 5–240 sec)' },
           { k: 'Frequency', v: '≥1/day; often multiple per hour (up to 200/day)' },
           { k: 'Location', v: 'Unilateral orbital/periorbital' },
           { k: 'Key features', v: 'Conjunctival injection AND lacrimation mandatory; other autonomic features may coexist' },
           { k: 'Episodic/Chronic', v: 'Episodic = remissions ≥1 month; Chronic = no remission >1 month for ≥1 year' },
           { k: 'Workup', v: 'MRI brain/pituitary — secondary SUNCT (e.g. posterior fossa lesion) must be excluded' }]);
      } else {
        html += resultCard('r-amber', 'SUNA', 'ICHD-3 3.3.2',
          'Short-lasting unilateral neuralgiform headache attacks with cranial autonomic symptoms (but not necessarily conjunctival injection AND tearing together).',
          [{ k: 'Duration', v: '1–600 seconds' },
           { k: 'Autonomic', v: 'One or more ipsilateral cranial autonomic features (not necessarily conj. injection + tearing together)' },
           { k: 'Workup', v: 'MRI brain/pituitary to exclude secondary cause' }]);
      }
      html += docNoteCard(); html += restartRow(); html += disclaimer();
      m.innerHTML = html; return;
    }

    // Paroxysmal hemicrania: 2–30 min, strict indomethacin response
    if (dur === 'min5_30') {
      html += resultCard('r-amber', 'Paroxysmal Hemicrania', 'ICHD-3 3.2',
        'Attacks identical to cluster headache but shorter (2–30 min) and more frequent, with an absolute response to indomethacin.',
        [{ k: 'Duration', v: '2–30 minutes per attack' },
         { k: 'Frequency', v: '>5/day for more than half the time' },
         { k: 'Location', v: 'Unilateral orbital, supraorbital, or temporal' },
         { k: 'Autonomic', v: '≥1 ipsilateral autonomic feature, or restlessness' },
         { k: 'Key diagnostic test', v: 'Absolute response to indomethacin (≥150 mg/day) — required for diagnosis' },
         { k: 'Episodic/Chronic', v: 'Episodic = remissions ≥1 month; Chronic = no remission >1 month for ≥1 year' },
         { k: 'Note', v: 'Indomethacin trial is both diagnostic and therapeutic' }]);
      html += docNoteCard(); html += restartRow(); html += disclaimer();
      m.innerHTML = html; return;
    }

    // Cluster headache: 15–180 min
    if (dur === 'min15_180') {
      html += resultCard('r-red', 'Cluster Headache', 'ICHD-3 3.1',
        'Severe to very severe unilateral orbital, supraorbital, and/or temporal pain with ipsilateral autonomic features or restlessness.',
        [{ k: 'Duration', v: '15–180 minutes (untreated)' },
         { k: 'Frequency', v: 'Every other day to 8 per day during cluster period' },
         { k: 'Autonomic', v: '≥1 ipsilateral feature (lacrimation, rhinorrhoea, ptosis, miosis, eyelid oedema, sweating) OR restlessness' },
         { k: 'Episodic', v: '≥2 cluster periods (7 days–1 year) separated by ≥3 month remissions' },
         { k: 'Chronic', v: 'No remission >3 months for ≥1 year' },
         { k: 'Workup', v: 'MRI brain to exclude secondary cluster (pituitary, posterior fossa lesion)' },
         { k: 'Acute Rx', v: 'Oxygen 100% 12–15 L/min × 15–20 min; subcutaneous sumatriptan 6 mg' },
         { k: 'Prevention', v: 'Verapamil first-line; suboccipital steroid injection for bridge therapy' }]);
      html += docNoteCard(); html += restartRow(); html += disclaimer();
      m.innerHTML = html; return;
    }
  }

  // ── 7. HEMICRANIA CONTINUA ─────────────────
  if (chron === 'continuous_unilat' || (dur === 'days_cont' && loc === 'unilateral_orbital' && hasAuto)) {
    html += resultCard('r-amber', 'Hemicrania Continua', 'ICHD-3 3.4',
      'Strictly unilateral continuous headache for >3 months with exacerbations, ipsilateral autonomic features or restlessness, and absolute indomethacin response.',
      [{ k: 'Pattern', v: 'Continuous, strictly unilateral; exacerbations of moderate–severe intensity' },
       { k: 'Duration', v: '>3 months' },
       { k: 'Autonomic', v: '≥1 ipsilateral autonomic feature and/or restlessness during exacerbations' },
       { k: 'Diagnostic test', v: 'Absolute response to indomethacin — required for ICHD-3 diagnosis (criterion D)' },
       { k: 'Indomethacin dose', v: 'Start 25 mg TID; titrate to 75–225 mg/day' },
       { k: 'Note', v: 'If indomethacin partially effective, consider HC spectrum; MRI to exclude structural cause' }]);
    html += docNoteCard(); html += restartRow(); html += disclaimer();
    m.innerHTML = html; return;
  }

  // ── 8. CHRONIC HIGH-FREQ: tension vs migraine ──
  if (freq === 'ge15_month') {
    if (chron === 'migraine_days') {
      html += resultCard('r-green', 'Chronic Migraine', 'ICHD-3 1.3',
        'Headache ≥15 days/month for >3 months, with ≥8 days/month meeting migraine criteria, in a patient with a prior history of episodic migraine.',
        [{ k: 'Frequency', v: '≥15 headache days/month for >3 months' },
         { k: 'Migraine days', v: '≥8 days/month with migraine features or triptan/ergot response' },
         { k: 'Prior history', v: 'Patient must have had ≥5 prior episodic migraine attacks (criteria B–D of 1.1 or 1.2)' },
         { k: 'Exclude MOH', v: 'Code separately if medication-overuse criteria also met (8.2)' },
         { k: 'Prevention', v: 'Topiramate, valproate, amitriptyline, propranolol, or CGRP monoclonal antibodies' },
         { k: 'Note', v: 'Many chronic migraine patients have coexisting MOH — both diagnoses should be coded' }]);
    } else if (chron === 'tension_days') {
      html += resultCard('r-teal', 'Chronic Tension-Type Headache', 'ICHD-3 2.3',
        'Headache ≥15 days/month for >3 months, evolving from episodic TTH, with typical TTH features.',
        [{ k: 'Frequency', v: '≥15 days/month, >3 months (≥180 days/year)' },
         { k: 'Duration', v: 'Hours to days, or unremitting' },
         { k: 'Features', v: '≥2 of: bilateral, pressing/tightening, mild-moderate, not aggravated by activity' },
         { k: 'Must lack', v: 'No moderate/severe nausea or vomiting; no more than 1 of photo/phono/mild nausea' },
         { k: 'Note', v: 'Pericranial tenderness is common — subclassify accordingly' }]);
    }
    html += docNoteCard(); html += restartRow(); html += disclaimer();
    m.innerHTML = html; return;
  }

  // ── 9. MIGRAINE WITH AURA ──────────────────
  if (aur && aur !== 'no_aura') {
    var aurType = '', aurLabel = '';
    if (aur === 'motor') { aurType = '1.2.3'; aurLabel = 'Hemiplegic Migraine'; }
    else if (aur === 'brainstem') { aurType = '1.2.2'; aurLabel = 'Migraine with Brainstem Aura'; }
    else if (aur === 'retinal') { aurType = '1.2.4'; aurLabel = 'Retinal Migraine'; }
    else { aurType = '1.2.1'; aurLabel = 'Migraine with Typical Aura'; }

    html += resultCard('r-green', aurLabel, 'ICHD-3 ' + aurType,
      'Migraine with aura requires ≥2 attacks with fully reversible aura symptoms meeting the timing and spread characteristics, with headache accompanying or following within 60 minutes.',
      [{ k: 'Aura type', v: aur === 'motor' ? 'Motor weakness (fully reversible) plus visual/sensory/speech' :
                           aur === 'brainstem' ? '≥2 brainstem symptoms (vertigo, diplopia, dysarthria, ataxia, tinnitus, ↓LOC — no motor/retinal)' :
                           aur === 'retinal' ? 'Monocular visual symptoms (positive or negative) — workup to exclude retinal artery pathology' :
                           'Visual and/or sensory and/or speech/language symptoms (no motor or brainstem)' },
       { k: 'Aura duration', v: '5–60 minutes per symptom; spreads gradually over ≥5 min' },
       { k: 'Headache', v: 'Accompanies or follows aura within 60 minutes (or aura without headache in 1.2.1.2)' },
       { k: 'Frequency', v: '≥2 attacks required for diagnosis' },
       { k: 'Workup note', v: aur === 'motor' ? 'Hemiplegic migraine: MRI + genetic testing (CACNA1A, ATP1A2, SCN1A) if familial' :
                             aur === 'brainstem' ? 'MRI posterior fossa to exclude structural cause' :
                             aur === 'retinal' ? 'Ophthalmology referral; FFA, OCT; exclude retinal artery occlusion' :
                             'MRI if atypical features; no routine imaging required for typical visual/sensory aura' }]);
    html += docNoteCard(); html += restartRow(); html += disclaimer();
    m.innerHTML = html; return;
  }

  // ── 10. MIGRAINE WITHOUT AURA ─────────────
  var migraineCharCount = 0;
  if (loc === 'unilateral_any' || loc === 'unilateral_orbital') migraineCharCount++;
  if (qual === 'pulsating') migraineCharCount++;
  if (inten === 'moderate' || inten === 'severe' || inten === 'very_severe') migraineCharCount++;
  if (hasAggravated) migraineCharCount++;
  var migraineAssocOk = (hasNausea) || (hasPhoto && hasPhono);
  var migraineDurOk = (dur === 'hr4_72');

  if (migraineCharCount >= 2 && migraineAssocOk && migraineDurOk) {
    var freqLabel = '';
    if (freq === 'lt1_month') freqLabel = 'Infrequent (<12 days/year)';
    else if (freq === '1_14_month') freqLabel = 'Episodic (1–14 days/month)';
    else freqLabel = 'High frequency';
    html += resultCard('r-green', 'Migraine without Aura', 'ICHD-3 1.1',
      'Recurrent disabling headache disorder with at least 2 of 4 characteristic features and associated nausea/vomiting or photo+phonophobia.',
      [{ k: 'Frequency required', v: '≥5 lifetime attacks meeting criteria' },
       { k: 'Duration', v: '4–72 hours (untreated or unsuccessfully treated)' },
       { k: 'Characteristics met', v: migraineCharCount + '/4 — ' + [
           (loc === 'unilateral_any' || loc === 'unilateral_orbital') ? 'unilateral' : '',
           qual === 'pulsating' ? 'pulsating' : '',
           (inten === 'moderate' || inten === 'severe' || inten === 'very_severe') ? 'mod–severe' : '',
           hasAggravated ? 'aggravated by activity' : ''
         ].filter(Boolean).join(', ') },
       { k: 'Associated Sx', v: hasNausea ? 'Nausea/vomiting' : 'Photophobia + Phonophobia' },
       { k: 'Current frequency', v: freqLabel },
       { k: 'Acute Rx', v: 'NSAIDs, triptans (5-HT1B/1D agonists), CGRP receptor antagonists (gepants), ditans' },
       { k: 'Prevention', v: 'Consider if ≥4 disabling headache days/month: topiramate, valproate, propranolol, amitriptyline, CGRP mAbs' }]);
    html += docNoteCard(); html += restartRow(); html += disclaimer();
    m.innerHTML = html; return;
  }

  // ── 11. TENSION-TYPE HEADACHE ─────────────
  var tthCount = 0;
  if (loc === 'bilateral') tthCount++;
  if (qual === 'pressure') tthCount++;
  if (inten === 'mild' || inten === 'moderate') tthCount++;
  if (!hasAggravated) tthCount++;
  var tthAssocOk = !hasNausea && !(hasPhoto && hasPhono);

  if (tthCount >= 2 && tthAssocOk) {
    var tthFreqLabel = '', tthCode = '';
    if (freq === 'lt1_month') { tthFreqLabel = 'Infrequent Episodic'; tthCode = '2.1'; }
    else if (freq === '1_14_month') { tthFreqLabel = 'Frequent Episodic'; tthCode = '2.2'; }
    else { tthFreqLabel = 'Chronic'; tthCode = '2.3'; }
    html += resultCard('r-teal', tthFreqLabel + ' Tension-Type Headache', 'ICHD-3 ' + tthCode,
      'Bilateral, pressing or tightening headache of mild to moderate intensity, not aggravated by activity, without nausea/vomiting and with no more than one of photophobia or phonophobia.',
      [{ k: 'Frequency', v: freq === 'lt1_month' ? '<1 day/month (<12 days/year)' : freq === '1_14_month' ? '1–14 days/month for >3 months' : '≥15 days/month for >3 months' },
       { k: 'Duration', v: tthCode === '2.3' ? 'Hours to days or unremitting' : '30 min – 7 days' },
       { k: 'Features met', v: tthCount + '/4 — ' + [loc === 'bilateral' ? 'bilateral' : '', qual === 'pressure' ? 'pressing/tightening' : '', (inten === 'mild' || inten === 'moderate') ? 'mild–moderate' : '', !hasAggravated ? 'not aggravated' : ''].filter(Boolean).join(', ') },
       { k: 'Must lack', v: 'No nausea/vomiting; ≤1 of photophobia or phonophobia' },
       { k: 'Subtype', v: 'With or without pericranial tenderness (EMG/palpation)' },
       { k: 'Rx', v: tthCode === '2.3' ? 'Amitriptyline (best evidence for prevention); NSAIDs for acute' : 'Simple analgesics (aspirin, paracetamol, NSAIDs) — limit to avoid MOH' }]);
    html += docNoteCard(); html += restartRow(); html += disclaimer();
    m.innerHTML = html; return;
  }

  // ── 12. PROBABLE / UNCLASSIFIED ───────────
  html += resultCard('r-amber', 'Probable or Unclassified Headache', 'ICHD-3 1.5 / 2.4 / 14',
    'The features entered do not clearly fulfill criteria for a single primary-headache diagnosis. Consider probable migraine (1.5) or probable TTH (2.4) if one criterion is missing, or refer for specialist headache assessment.',
    [{ k: 'Migraine criteria met', v: migraineCharCount + '/4 features, duration: ' + (migraineDurOk ? '✓' : '✗') + ', associated Sx: ' + (migraineAssocOk ? '✓' : '✗') },
     { k: 'TTH criteria met', v: tthCount + '/4 features, assoc criteria: ' + (tthAssocOk ? '✓' : '✗') },
     { k: 'Next steps', v: 'Complete headache diary (frequency, duration, features, triggers, medication use); specialist assessment' },
     { k: 'Consider', v: 'Secondary headache excluded? Cervicogenic (11.2.1), sleep apnoea (10.1.4), IIH (7.1.1), idiopathic facial pain (13.12)' }]);
  html += docNoteCard(); html += restartRow(); html += disclaimer();
  m.innerHTML = html;
}

// ── Verdict banner (free-form body) ────────────
function verdictBanner(cls, eyebrow, title, bodyHtml) {
  var map = { 'r-red': ['var(--red)', 'var(--red-bg)', 'conf-r'], 'r-green': ['var(--green)', 'var(--green-bg)', 'conf-g'], 'r-amber': ['var(--amber)', 'var(--amber-bg)', 'conf-a'], 'r-purple': ['var(--purple)', 'var(--purple-bg)', 'conf-p'], 'r-teal': ['var(--teal)', 'var(--teal-bg)', 'conf-t'], 'r-blue': ['var(--blue)', 'var(--blue-bg)', 'conf-b'] };
  var c = map[cls] || map['r-teal'];
  var h = '<div class="vban" style="border-color:' + c[0] + ';background:' + c[1] + ';">';
  h += '<div class="vban-head">';
  h += '<div class="vlbl">' + eyebrow + '</div>';
  h += '<div class="vtitle" style="color:' + c[0] + ';">' + title + '</div>';
  h += '</div>';
  h += '<div class="vdesc">' + bodyHtml + '</div>';
  h += '</div>';
  return h;
}

// ── Result card (verdict banner + criteria table) ──
function resultCard(cls, title, ichd, summary, criteria) {
  setDx(title, ichd, summary, criteria);
  var map = { 'r-red': ['var(--red)', 'var(--red-bg)', 'conf-r'], 'r-green': ['var(--green)', 'var(--green-bg)', 'conf-g'], 'r-amber': ['var(--amber)', 'var(--amber-bg)', 'conf-a'], 'r-purple': ['var(--purple)', 'var(--purple-bg)', 'conf-p'], 'r-teal': ['var(--teal)', 'var(--teal-bg)', 'conf-t'], 'r-blue': ['var(--blue)', 'var(--blue-bg)', 'conf-b'] };
  var c = map[cls] || map['r-teal'];
  var h = '<div class="vban" style="border-color:' + c[0] + ';background:' + c[1] + ';">';
  h += '<div class="vban-head">';
  h += '<div class="vlbl">ICHD-3 Diagnosis</div>';
  h += '<div class="vconf ' + c[2] + '">' + ichd + '</div>';
  h += '<div class="vtitle" style="color:' + c[0] + ';">' + title + '</div>';
  h += '</div>';
  h += '<div class="vdesc">' + summary + '</div>';
  h += '</div>';
  if (criteria && criteria.length) {
    h += '<div class="dx-card"><div class="slabel" style="margin-bottom:10px;">Diagnostic Criteria Summary <span class="pill pill-t">ICHD-3</span></div>';
    criteria.forEach(function (cr) {
      h += '<div class="dx-row"><div class="dx-key">' + cr.k + '</div><div class="dx-val">' + cr.v + '</div></div>';
    });
    h += '</div>';
  }
  return h;
}

function restartRow() {
  return '<div class="nav-row">' + backBtn()
    + '<button class="nbtn np" onclick="restart()">&#8635; Start Over</button></div>';
}

function disclaimer() {
  return '<div class="ref-section">'
    + '<div style="font-size:10px;font-weight:700;color:var(--text2);margin-bottom:6px;letter-spacing:0.04em;">CLASSIFICATION REFERENCE</div>'
    + '<div>Headache Classification Committee of the International Headache Society (IHS). The International Classification of Headache Disorders, 3rd edition. <em>Cephalalgia</em> 2018;38(1):1–211.</div>'
    + '<div>Do TP et al. Red and orange flags for secondary headaches. <em>Neurology</em> 2019;92:134–144.</div>'
    + '<div class="disc">⚠ EDUCATIONAL SUPPORT ONLY. This tool supports structured reasoning and criteria review for trainees and educators. It does not replace clinical judgment, full history and examination, or exclusion of secondary causes. Apply primary-headache criteria only after red flags have been addressed.</div>'
    + '</div>';
}

// ═══════════════════════════════════════════════
//  DOCUMENTATION NOTE
// ═══════════════════════════════════════════════
var _currentDx = { title: '', ichd: '', summary: '', criteria: [] };
function setDx(title, ichd, summary, criteria) { _currentDx = { title: title, ichd: ichd, summary: summary, criteria: criteria || [] }; }

function buildDocNote() {
  var a = S.answers;
  var ds = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  var lines = [];
  lines.push('HEADACHE CONSULTATION — ICHD-3 CLASSIFICATION');
  lines.push('Date: ' + ds);
  lines.push('Reference: International Classification of Headache Disorders, 3rd Edition (ICHD-3)');
  lines.push('');
  lines.push('DIAGNOSIS');
  lines.push(_currentDx.title);
  lines.push('ICHD-3 Code: ' + _currentDx.ichd);
  lines.push('');
  lines.push('CLINICAL SUMMARY');
  lines.push(_currentDx.summary);
  lines.push('');
  lines.push('CLINICAL FEATURES DOCUMENTED');
  var rf = a.red_flags || [];
  var dangerRf = rf.filter(function (v) { return v !== 'none'; });
  if (rf.length) {
    var rfShort = { thunderclap: 'Thunderclap onset', progressive: 'Progressive headache', fever: 'Fever/meningismus', neuro: 'Focal neurological deficit', papilledema: 'Papilledema/raised ICP', age50: 'New headache age >50', positional: 'Positional/Valsalva', hiv: 'Immunocompromised/HIV/cancer', postpartum: 'Postpartum/pregnant' };
    lines.push('  Red flags: ' + (dangerRf.length ? dangerRf.map(function (v) { return rfShort[v] || v; }).join(', ') : 'None reported'));
  }
  var onsetMap = { sudden: 'Sudden (thunderclap — maximal within 60 seconds)', subacute: 'Subacute (minutes to hours)', gradual: 'Gradual (days to weeks)', chronic_new: 'Daily and unremitting from onset (NDPH pattern)' };
  if (a.onset) lines.push('  Onset: ' + (onsetMap[a.onset] || a.onset));
  var patMap = { episodic: 'Episodic (discrete attacks, pain-free between episodes)', chronic_cont: 'Chronic/continuous (>=15 days/month)', cluster_pattern: 'Cluster-period pattern (bouts separated by remissions)' };
  if (a.pattern) lines.push('  Pattern: ' + (patMap[a.pattern] || a.pattern));
  var durMap = { seconds: 'Seconds (1-30 seconds per attack)', min1_5: '1-5 minutes per attack', min5_30: '5-30 minutes per attack', min15_180: '15 minutes - 3 hours per attack', hr4_72: '4-72 hours per attack', days_cont: 'Days or continuous' };
  if (a.duration) lines.push('  Attack duration: ' + (durMap[a.duration] || a.duration));
  var locMap = { unilateral_orbital: 'Unilateral orbital/periorbital/temporal (side-locked)', unilateral_any: 'Unilateral (may switch sides between attacks)', bilateral: 'Bilateral (band-like or diffuse)', vertex_occipital: 'Vertex, occipital, or posterior cranial', face_jaw: 'Facial, jaw, lower head, or neck', coin_sized: 'Coin-sized fixed scalp area' };
  if (a.location) lines.push('  Location: ' + (locMap[a.location] || a.location));
  var qualMap = { pulsating: 'Pulsating/throbbing', pressure: 'Pressing/tightening (non-pulsating)', stabbing: 'Sharp/stabbing/electric shock-like', burning: 'Burning/lancinating', severe_unilateral: 'Severe boring/excruciating (periorbital)', mixed: 'Mixed or variable' };
  if (a.quality) lines.push('  Quality: ' + (qualMap[a.quality] || a.quality));
  var intMap = { mild: 'Mild (does not limit activity)', moderate: 'Moderate (limits but does not prohibit activity)', severe: 'Severe (prohibits activity)', very_severe: 'Very severe/excruciating (incapacitating)' };
  if (a.intensity) lines.push('  Severity: ' + (intMap[a.intensity] || a.intensity));
  var assoc = a.assoc || [];
  var assocReal = assoc.filter(function (v) { return v !== 'none_assoc'; });
  if (assocReal.length > 0) {
    var assocLabels = { nausea: 'Nausea/vomiting', photo: 'Photophobia', phono: 'Phonophobia', aggravated_activity: 'Aggravated by routine physical activity', restless: 'Restlessness/agitation during attack' };
    lines.push('  Associated symptoms: ' + assocReal.map(function (v) { return assocLabels[v] || v; }).join(', '));
  } else if (assoc.length) {
    lines.push('  Associated symptoms: None reported');
  }
  var auto = a.autonomic || [];
  var autoReal = auto.filter(function (v) { return v !== 'none_auto'; });
  if (autoReal.length > 0) {
    var autoLabels = { conjunctival: 'Conjunctival injection/lacrimation', nasal: 'Nasal congestion/rhinorrhoea', eyelid: 'Eyelid oedema/ptosis', forehead: 'Forehead/facial sweating', miosis: 'Miosis (Horner-like)', aural: 'Aural fullness' };
    lines.push('  Ipsilateral autonomic features: ' + autoReal.map(function (v) { return autoLabels[v] || v; }).join(', '));
  }
  var aurMap = { visual: 'Visual aura (scintillating scotoma/fortification spectra/visual field defect)', sensory: 'Sensory aura (spreading paresthesias/numbness)', speech: 'Speech/language aura (aphasia/dysarthria)', motor: 'Motor aura (hemiplegic — fully reversible)', brainstem: 'Brainstem aura (vertigo, diplopia, dysarthria, ataxia)', retinal: 'Retinal/monocular visual symptoms', no_aura: 'No aura' };
  if (a.aura) lines.push('  Aura: ' + (aurMap[a.aura] || a.aura));
  var freqMap = { lt1_month: '<1 day/month (<12 days/year)', '1_14_month': '1-14 days/month', ge15_month: '>=15 days/month', daily_8: '1-8 attacks/day', every_other: 'Every other day to 8/day during cluster periods' };
  if (a.freq) lines.push('  Attack frequency: ' + (freqMap[a.freq] || a.freq));
  var chronMap = { migraine_days: '>=8 days/month with migraine features', tension_days: 'Mostly tension-type features', continuous_unilat: 'Continuous strictly unilateral (autonomic/indomethacin-responsive)' };
  if (a.chronicity) lines.push('  High-frequency pattern: ' + (chronMap[a.chronicity] || a.chronicity));
  var moaMap = { triptan_overuse: 'Triptan/ergotamine overuse (>=10 days/month for >3 months)', analgesic_overuse: 'Analgesic/NSAID overuse (>=15 days/month for >3 months)', opioid_overuse: 'Opioid/combination overuse (>=10 days/month for >3 months)', no_overuse: 'No medication overuse' };
  if (a.moa) lines.push('  Acute medication use: ' + (moaMap[a.moa] || a.moa));
  lines.push('');
  if (_currentDx.criteria && _currentDx.criteria.length) {
    lines.push('ICHD-3 DIAGNOSTIC CRITERIA');
    _currentDx.criteria.forEach(function (c) { lines.push('  ' + c.k + ': ' + c.v); });
    lines.push('');
  }
  lines.push('CLASSIFICATION BASIS');
  lines.push('Diagnosis assigned per ICHD-3 criteria using structured stepwise evaluation.');
  lines.push('Ref: Headache Classification Committee of the IHS. The International Classification of Headache Disorders, 3rd edition. Cephalalgia. 2018;38(1):1-211.');
  lines.push('For educational and training use only. Does not replace attending physician judgment.');
  return lines.join('\n');
}

function docNoteCard() {
  return '<div class="doc-header">'
    + '<button class="doc-tog" onclick="toggleDoc()">&#9660; Clinical Documentation Note</button>'
    + '<button class="copy-btn" id="copyBtn" onclick="copyDocNote()">&#9106; Copy</button>'
    + '</div>'
    + '<pre class="doc-body" id="docNoteBody">' + buildDocNote() + '</pre>';
}

window.toggleDoc = function () {
  var body = document.getElementById('docNoteBody'), tog = document.querySelector('.doc-tog');
  if (!body) return;
  var open = body.classList.toggle('open');
  if (tog) tog.innerHTML = open ? '&#9650; Clinical Documentation Note' : '&#9660; Clinical Documentation Note';
};

window.copyDocNote = function () {
  var body = document.getElementById('docNoteBody'), btn = document.getElementById('copyBtn');
  if (!body) return;
  var txt = body.textContent || body.innerText;
  var done = function () { if (btn) { btn.innerHTML = '&#10003; Copied'; btn.classList.add('copied'); setTimeout(function () { btn.innerHTML = '&#9106; Copy'; btn.classList.remove('copied'); }, 2000); } };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done).catch(function () {
      var ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta); done();
    });
  } else {
    var ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta); done();
  }
};

render();
</script>
</body>
</html>
