<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Peripheral Localizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#2dd4bf; --accent-2:#5eead4; --accent-soft:rgba(45,212,191,.13); --accent-line:rgba(45,212,191,.35);
  --purple:#a78bfa; --purple-soft:rgba(167,139,250,.14);
  --g0:#ef4444; --g1:#f97316; --g2:#f59e0b; --g3:#eab308; --g4:#84cc16; --g5:#22c55e;
  --weak:#f87171; --normal:#34d399; --warn:#fbbf24;
  --reflex:#38bdf8; --reflex-soft:rgba(56,189,248,.14); --reflex-line:rgba(56,189,248,.4);
  --umn:#fb7185; --umn-soft:rgba(251,113,133,.14);
}
html[data-theme="dark"]{
  --bg:#0e141b; --surface:#161e27; --surface-2:#1d2832; --surface-3:#243240;
  --border:#2a3743; --border-2:#34434f; --text:#e9eef3; --text-dim:#94a3b1; --text-faint:#64748b;
  --shadow:0 8px 30px rgba(0,0,0,.45);
}
html[data-theme="light"]{
  --bg:#eef2f6; --surface:#ffffff; --surface-2:#f4f7fa; --surface-3:#e8eef4;
  --border:#dde4ec; --border-2:#cdd6e0; --text:#16202b; --text-dim:#566375; --text-faint:#8a97a6;
  --accent:#0d9488; --accent-2:#0f766e; --accent-soft:rgba(13,148,136,.10); --accent-line:rgba(13,148,136,.30);
  --purple:#7c3aed; --purple-soft:rgba(124,58,237,.10);
  --shadow:0 8px 30px rgba(60,80,110,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Lexend',system-ui,sans-serif; background:var(--bg); color:var(--text);
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  padding-bottom:108px;
}
.mono{font-family:'Lexend',sans-serif; font-variant-numeric:tabular-nums; letter-spacing:.005em}
/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:40; background:var(--bg);
  border-bottom:1px solid var(--border);
  padding:env(safe-area-inset-top) 0 0 0;
}
.head-row{display:flex; align-items:center; gap:12px; padding:13px 16px 11px}
.brand{display:flex; flex-direction:column; gap:1px; flex:1; min-width:0}
.brand h1{font-size:17px; font-weight:600; letter-spacing:-.01em; margin:0; display:flex; align-items:center; gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);flex:none}
.brand .sub{font-size:11.5px; color:var(--text-faint); font-weight:400; letter-spacing:.02em}
.icon-btn{
  flex:none; width:40px; height:40px; border-radius:11px; border:1px solid var(--border-2);
  background:var(--surface); color:var(--text); display:grid; place-items:center; cursor:pointer;
  transition:.15s; font-size:18px;
}
.icon-btn:active{transform:scale(.94)}
.icon-btn:hover{border-color:var(--accent-line)}
/* ---------- tabs ---------- */
.tabs{display:flex; gap:6px; padding:0 16px 12px}
.tab{
  flex:1; padding:10px 8px; border-radius:11px; border:1px solid var(--border);
  background:var(--surface); color:var(--text-dim); font-family:'Lexend'; font-size:13.5px; font-weight:500;
  cursor:pointer; transition:.15s; display:flex; flex-direction:column; align-items:center; gap:2px;
}
.tab .cnt{font-size:10.5px; color:var(--text-faint); font-weight:400}
.tab.active{background:var(--accent-soft); border-color:var(--accent-line); color:var(--text)}
.tab.active .cnt{color:var(--accent)}
/* ---------- motor/sensory segmented control ---------- */
.modeseg{display:flex; align-items:center; gap:10px; padding:0 16px 12px; margin-top:-2px}
.mode-label{flex:none; font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--text-faint)}
.mode-switch{flex:1; display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--border-2); border-radius:12px; padding:4px}
.seg{
  flex:1; padding:9px 6px; border-radius:9px; border:none; background:transparent;
  color:var(--text-dim); font-family:'Lexend'; font-size:12.5px; font-weight:600; white-space:nowrap;
  cursor:pointer; transition:.15s; display:flex; align-items:center; justify-content:center; gap:5px;
}
.seg.active[data-mode="motor"]{background:var(--accent); color:#06231f}
.seg.active[data-mode="sensory"]{background:var(--purple); color:#fff}
.seg.active[data-mode="reflex"]{background:var(--reflex); color:#06222e}
html[data-theme="light"] .seg.active[data-mode="motor"]{color:#fff}
html[data-theme="light"] .seg.active[data-mode="reflex"]{color:#04222e}
.seg .segc{font-size:10.5px; font-weight:700; min-width:16px; height:16px; padding:0 4px; border-radius:8px; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.18); color:inherit}
.seg .segc.on{display:inline-flex}
.seg:not(.active) .segc.on{background:var(--surface-3); color:var(--text-dim)}
/* ---------- sensory cards ---------- */
.sgroup-head{display:flex; align-items:baseline; gap:9px; margin:18px 2px 9px}
.sgroup-head:first-of-type{margin-top:14px}
.sgroup-head h2{font-size:13px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--purple); margin:0}
.sgroup-head .ssub{font-size:11px; color:var(--text-faint)}
.scard{
  background:var(--surface); border:1px solid var(--border); border-radius:13px;
  padding:11px 12px; margin-bottom:8px; transition:border-color .15s, background .15s; cursor:pointer;
}
.scard.sel{border-color:rgba(248,113,113,.5); background:linear-gradient(180deg,rgba(248,113,113,.06),transparent 70%)}
.scard .s-top{display:flex; align-items:flex-start; gap:9px}
.scard .s-name{flex:1; min-width:0}
.scard .s-name .sn{font-size:14px; font-weight:500; letter-spacing:-.005em}
.scard .s-name .sdist{font-size:11.5px; color:var(--text-dim); margin-top:2px; line-height:1.4}
.scard .s-name .sloc{font-size:11px; color:var(--purple); margin-top:3px; font-weight:500}
.s-toggle{
  flex:none; min-width:64px; height:34px; border-radius:9px; border:1px solid var(--border-2);
  background:var(--surface-2); color:var(--text-dim); font-size:12px; font-weight:600;
  display:grid; place-items:center; transition:.12s; font-family:'Lexend'; pointer-events:none;
}
.scard.sel .s-toggle{background:var(--weak); color:#fff; border-color:transparent}
html[data-theme="light"] .scard.sel .s-toggle{color:#fff}
/* sensory section banner + dermatome reference image */
.sens-banner{
  margin:14px 0 6px; border:1px solid rgba(167,139,250,.4); border-radius:16px; overflow:hidden;
  background:linear-gradient(180deg,var(--purple-soft),transparent 70%);
}
.sens-banner .sb-head{display:flex; align-items:center; gap:10px; padding:13px 15px 11px}
.sens-banner .sb-badge{flex:none; font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#fff; background:var(--purple); padding:4px 9px; border-radius:8px}
.sens-banner .sb-txt{min-width:0}
.sens-banner .sb-txt .t1{font-size:14.5px; font-weight:600}
.sens-banner .sb-txt .t2{font-size:11.5px; color:var(--text-dim); margin-top:1px}
.derm-fig{margin:0 11px 12px; border-radius:12px; overflow:hidden; border:1px solid var(--border-2); background:#fff; cursor:zoom-in; position:relative}
.derm-fig img{display:block; width:100%; height:auto}
.derm-fig .zhint{position:absolute; bottom:8px; right:8px; background:rgba(14,20,27,.82); color:#fff; font-size:10.5px; font-weight:500; padding:4px 9px; border-radius:7px; pointer-events:none}
.derm-cap{font-size:10.5px; color:var(--text-faint); line-height:1.5; padding:0 16px 8px}
.derm-fallback{margin:0 11px 12px; padding:14px; border-radius:12px; border:1px dashed var(--border-2); background:var(--surface-2); color:var(--text-dim); font-size:12px; line-height:1.5}
/* lightbox */
.lightbox{position:fixed; inset:0; z-index:90; background:rgba(5,9,14,.92); display:none; align-items:center; justify-content:center; padding:14px}
.lightbox.show{display:flex}
.lightbox img{max-width:100%; max-height:100%; object-fit:contain; border-radius:8px; background:#fff}
.lightbox .lb-x{position:absolute; top:calc(12px + env(safe-area-inset-top)); right:14px; width:40px; height:40px; border-radius:11px; border:1px solid rgba(255,255,255,.3); background:rgba(0,0,0,.4); color:#fff; font-size:20px; display:grid; place-items:center; cursor:pointer}
/* ---------- reflex cards ---------- */
.rcard{background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:12px; margin-bottom:8px; transition:border-color .15s}
.rcard.graded{border-color:var(--reflex-line)}
.rcard.umnpos{border-color:rgba(251,113,133,.55); background:linear-gradient(180deg,var(--umn-soft),transparent 70%)}
.rcard .r-top{display:flex; align-items:flex-start; gap:9px; margin-bottom:10px}
.rcard .r-name{flex:1; min-width:0}
.rcard .r-name .rn{font-size:14.5px; font-weight:600; letter-spacing:-.005em}
.rcard .r-name .rsub{font-size:11.5px; color:var(--text-dim); margin-top:2px; line-height:1.4}
.rcard .r-umnbadge{flex:none; font-size:9.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--umn); border:1px solid rgba(251,113,133,.4); background:var(--umn-soft); padding:3px 7px; border-radius:7px}
/* DTR 0–4+ scale (U-shaped colours) */
.rgrades{display:flex; gap:5px}
.rgrade{flex:1; min-width:0; height:40px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); color:var(--text-dim); font-family:'Lexend'; font-size:13px; font-weight:600; cursor:pointer; transition:.12s; display:grid; place-items:center}
.rgrade:active{transform:scale(.93)}
.rgrade .rgl{font-size:9px; font-weight:600; opacity:.7; margin-top:1px}
.rgrade.sel{color:#0e141b; border-color:transparent}
html[data-theme="light"] .rgrade.sel{color:#fff}
.rgrade.sel[data-rv="0"]{background:#3b82f6}
.rgrade.sel[data-rv="1"]{background:#60a5fa}
.rgrade.sel[data-rv="2"]{background:var(--g5)}
.rgrade.sel[data-rv="3"]{background:var(--g2)}
.rgrade.sel[data-rv="4"]{background:var(--g0)}
/* pathological / UMN reflex options */
.path-opts{display:flex; gap:5px}
.popt{flex:1; min-width:0; padding:10px 6px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); color:var(--text-dim); font-family:'Lexend'; font-size:12.5px; font-weight:600; cursor:pointer; transition:.12s; text-align:center}
.popt:active{transform:scale(.95)}
.popt.sel{border-color:transparent; color:#fff}
.popt.sel[data-pos="0"]{background:var(--normal); color:#0e141b}
html[data-theme="light"] .popt.sel[data-pos="0"]{color:#fff}
.popt.sel[data-pos="1"]{background:var(--umn)}
/* UMN banner in results */
.umn-banner{border:1px solid rgba(251,113,133,.5); background:var(--umn-soft); border-radius:14px; padding:14px 15px; margin-bottom:12px}
.umn-banner .ub-h{display:flex; align-items:center; gap:9px; font-size:14px; font-weight:700; color:var(--umn)}
.umn-banner .ub-h .ico{width:22px; height:22px; border-radius:50%; border:2px solid var(--umn); display:grid; place-items:center; font-size:13px; flex:none}
.umn-banner .ub-body{font-size:12.5px; color:var(--text-dim); line-height:1.55; margin-top:8px}
.umn-banner .ub-list{font-size:12px; color:var(--text); margin-top:7px; font-weight:500}
/* ---------- content ---------- */
main{padding:6px 16px 0}
.movement{margin:18px 0 0}
.movement:first-child{margin-top:14px}
.mv-head{display:flex; align-items:baseline; gap:9px; margin:0 2px 9px}
.mv-head h2{font-size:13px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--accent); margin:0}
.mv-head .mvsub{font-size:11px; color:var(--text-faint)}
/* muscle card */
.muscle{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:11px 12px 12px; margin-bottom:9px; transition:border-color .15s, background .15s;
}
.muscle.graded{border-color:var(--border-2)}
.muscle.weak{border-color:rgba(248,113,113,.45); background:linear-gradient(180deg,rgba(248,113,113,.05),transparent 60%)}
.muscle.spared{border-color:rgba(52,211,153,.4)}
.m-top{display:flex; align-items:flex-start; gap:9px; margin-bottom:9px}
.m-name{flex:1; min-width:0}
.m-name .mn{font-size:14.5px; font-weight:500; letter-spacing:-.005em}
.m-name .mmeta{font-size:11px; color:var(--text-dim); margin-top:2px; font-weight:400}
.m-name .mmeta .nv{color:var(--text-dim)}
.m-name .mmeta .rt{color:var(--accent); font-weight:500}
.info-btn{
  flex:none; width:26px; height:26px; border-radius:8px; border:1px solid var(--border-2);
  background:var(--purple-soft); color:var(--purple); font-size:12px; font-weight:600;
  cursor:pointer; display:grid; place-items:center; transition:.15s; font-family:'Lexend';
}
.info-btn:active{transform:scale(.9)}
/* grade selector */
.grades{display:flex; gap:4px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch; scrollbar-width:none}
.grades::-webkit-scrollbar{display:none}
.grade{
  flex:1 0 auto; min-width:34px; height:38px; border-radius:9px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text-dim); font-family:'Lexend'; font-size:13.5px; font-weight:500;
  cursor:pointer; transition:.12s; display:grid; place-items:center;
}
.grade:active{transform:scale(.93)}
.grade.sel{color:#0e141b; font-weight:600; border-color:transparent}
html[data-theme="light"] .grade.sel{color:#fff}
.grade.sel[data-v="0"],.grade.sel[data-v="1"]{background:var(--g0)}
.grade.sel[data-v="2"]{background:var(--g1)}
.grade.sel[data-v="3"]{background:var(--g2)}
.grade.sel[data-v="3.66"],.grade.sel[data-v="4"]{background:var(--g3)}
.grade.sel[data-v="4.33"]{background:var(--g4)}
.grade.sel[data-v="5"]{background:var(--g5)}
.m-detail{display:none}
.muscle.open .m-detail{display:block; margin-top:11px; padding-top:11px; border-top:1px dashed var(--border-2)}
.dtable{width:100%; font-size:12px}
.dtable .row{display:flex; gap:8px; padding:3.5px 0}
.dtable .k{flex:none; width:96px; color:var(--text-faint); font-weight:400}
.dtable .v{flex:1; color:var(--text); font-family:'Lexend'; font-size:11.5px; line-height:1.5}
.dtable .v .hl{color:var(--accent)}
.empty-region{text-align:center; color:var(--text-faint); font-size:12.5px; padding:30px 10px}
/* ---------- bottom bar ---------- */
.bottombar{
  position:fixed; left:0; right:0; bottom:0; z-index:45;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent,var(--bg) 22%);
}
.bb-inner{
  display:flex; align-items:center; gap:11px; background:var(--surface);
  border:1px solid var(--border-2); border-radius:15px; padding:9px 9px 9px 15px; box-shadow:var(--shadow);
}
.bb-stat{flex:1; display:flex; flex-direction:column; gap:1px; min-width:0}
.bb-stat .l1{font-size:12px; color:var(--text-dim)}
.bb-stat .l1 b{color:var(--text); font-weight:600}
.bb-stat .l2{font-size:11px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bb-stat .l2 .wk{color:var(--weak); font-weight:500}
.analyze-btn{
  flex:none; padding:11px 17px; border-radius:11px; border:none; background:var(--accent); color:#06231f;
  font-family:'Lexend'; font-weight:600; font-size:13.5px; cursor:pointer; transition:.15s; letter-spacing:.01em;
}
html[data-theme="light"] .analyze-btn{color:#fff}
.analyze-btn:active{transform:scale(.95)}
.analyze-btn:disabled{background:var(--surface-3); color:var(--text-faint); cursor:default}
/* ---------- sheet ---------- */
.scrim{position:fixed; inset:0; z-index:60; background:rgba(5,9,14,.6); backdrop-filter:blur(3px); opacity:0; pointer-events:none; transition:.22s}
.scrim.show{opacity:1; pointer-events:auto}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:61; max-height:90vh; display:flex; flex-direction:column;
  background:var(--surface); border-top-left-radius:22px; border-top-right-radius:22px;
  border-top:1px solid var(--border-2); box-shadow:0 -10px 40px rgba(0,0,0,.4);
  transform:translateY(102%); transition:transform .28s cubic-bezier(.32,.72,0,1);
}
.sheet.show{transform:translateY(0)}
.sheet-grip{display:flex; justify-content:center; padding:9px 0 3px}
.sheet-grip span{width:38px; height:4px; border-radius:3px; background:var(--border-2)}
.sheet-head{display:flex; align-items:center; gap:10px; padding:4px 18px 12px; border-bottom:1px solid var(--border)}
.sheet-head h2{flex:1; font-size:16px; font-weight:600; margin:0}
.sheet-head .x{width:32px;height:32px;border-radius:9px;border:1px solid var(--border-2);background:var(--surface-2);color:var(--text-dim);cursor:pointer;font-size:17px;display:grid;place-items:center}
.sheet-body{overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 18px 4px}
.sheet-actions{display:flex; gap:9px; padding:12px 18px calc(16px + env(safe-area-inset-bottom)); border-top:1px solid var(--border)}
.act{flex:1; padding:12px; border-radius:12px; font-family:'Lexend'; font-weight:600; font-size:13.5px; cursor:pointer; border:1px solid var(--border-2); background:var(--surface-2); color:var(--text); transition:.15s}
.act:active{transform:scale(.97)}
.act.primary{background:var(--purple); border-color:transparent; color:#fff}
/* result blocks */
.rb{background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:13px 14px; margin-bottom:12px}
.rb-title{font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); margin:0 0 9px}
.loc-primary{background:var(--accent-soft); border-color:var(--accent-line)}
.loc-line{display:flex; align-items:flex-start; gap:10px; padding:7px 0; border-bottom:1px solid var(--border)}
.loc-line:last-child{border-bottom:none; padding-bottom:0}
.loc-line:first-of-type{padding-top:0}
.loc-k{flex:none; width:84px; font-size:11.5px; color:var(--text-dim); padding-top:2px}
.loc-v{flex:1; font-size:14px; font-weight:500}
.loc-v.big{font-size:16px; font-weight:600}
.loc-v .mono{font-family:'Lexend'; color:var(--accent); font-weight:600}
.loc-v .none{color:var(--text-faint); font-weight:400; font-size:13px; font-style:italic}
.tag{display:inline-block; font-family:'Lexend'; font-size:12px; font-weight:600; padding:2px 8px; border-radius:7px; background:var(--accent-soft); color:var(--accent); margin:0 4px 4px 0; border:1px solid var(--accent-line)}
.interp{font-size:13.5px; line-height:1.55; color:var(--text)}
.interp .em{color:var(--accent); font-weight:600}
.chip-row{display:flex; flex-wrap:wrap; gap:5px; margin-top:3px}
.chip{font-size:11.5px; padding:4px 9px; border-radius:8px; font-family:'Lexend'; border:1px solid var(--border-2)}
.chip.w{background:rgba(248,113,113,.12); color:var(--weak); border-color:rgba(248,113,113,.3)}
.chip.s{background:rgba(52,211,153,.1); color:var(--normal); border-color:rgba(52,211,153,.3)}
.chip.u{background:var(--surface-3); color:var(--text-dim)}
.chip .gr{opacity:.8; margin-left:5px}
.suggest{font-size:12.5px; color:var(--text-dim); line-height:1.5}
.suggest b{color:var(--text); font-weight:500}
.note-warn{display:flex; gap:9px; background:rgba(251,191,36,.1); border:1px solid rgba(251,191,36,.3); border-radius:12px; padding:11px 12px; margin-bottom:12px; font-size:12.5px; line-height:1.5; color:var(--text)}
.note-warn .i{flex:none; color:var(--warn); font-weight:700}
.disclaimer{font-size:11px; color:var(--text-faint); line-height:1.5; padding:2px 2px 8px}
.empty-res{text-align:center; padding:40px 16px; color:var(--text-faint)}
.empty-res .big{font-size:15px; color:var(--text-dim); margin-bottom:4px}
.refs{font-size:11px; color:var(--text-faint); line-height:1.55; border-top:1px solid var(--border); padding-top:11px; margin-top:2px}
.toast{position:fixed; left:50%; bottom:130px; transform:translateX(-50%) translateY(10px); z-index:80; background:var(--text); color:var(--bg); font-size:13px; font-weight:500; padding:10px 18px; border-radius:11px; opacity:0; pointer-events:none; transition:.2s}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
@media(min-width:680px){
  body{max-width:760px; margin:0 auto}
  .sheet,.scrim{max-width:760px; margin:0 auto}
  .bottombar{max-width:760px; margin:0 auto}
}
</style>
</head>

/* ---------------- rendering ---------------- */
const main = document.getElementById('main');
function render(){
  if(mode==='sensory'){ renderSensory(); updateSummary(); return; }
  if(mode==='reflex'){ renderReflexes(); updateSummary(); return; }
  const list = M.filter(m=>m.region===region);
  const groups = {};
  list.forEach(m=>{(groups[m.mv]=groups[m.mv]||[]).push(m)});
  let html='';
  for(const mv in groups){
    const muscles = groups[mv];
    const multi = muscles.length>1;
    html += `<section class="movement"><div class="mv-head"><h2>${mv}</h2>${multi?`<span class="mvsub">${muscles.length} muscles</span>`:''}</div>`;
    muscles.forEach(m=>{ html += muscleCard(m); });
    html += `</section>`;
  }
  main.innerHTML = html;
  bindCards();
  updateSummary();
}
function renderSensory(){
  const list = SENS.filter(s=>s.region===region);

function sensoryCard(s){
  const sel = !!sensState[s.id];
  let loc;
  if(s.type==='dermatome'){ loc = `Root ${s.root} (dermatomal)`; }
  else {
    const plx = s.region==='UE' ? [s.trunk?s.trunk+' trunk':null, (s.cord&&s.cord.length)?s.cord.map(c=>c+' cord').join('/'):null].filter(Boolean).join(' · ')
                                : (s.plexus||'');
    loc = `${s.nerve}${plx?` · ${plx}`:''} · roots ${s.pred.join('–')}`;
  }
  return `<div class="scard ${sel?'sel':''}" id="scard-${s.id}" data-sid="${s.id}">
    <div class="s-top">
      <div class="s-name">
        <div class="sn">${s.name}</div>
        <div class="sdist">${s.dist}</div>
        <div class="sloc">→ ${loc}</div>
      </div>
      <div class="s-toggle">${sel?'Reduced':'Normal'}</div>

}

function reflexCard(r){
  const st = reflexState[r.id];
  if(r.type==='dtr'){
    const graded = st!==undefined;
    const sub = `${r.nerve} · ${r.pred.join('–')}`;
    const btns = REFLEX_GRADES.map(g=>{
      const sel = graded && st.v===g.v;
      return `<button class="rgrade ${sel?'sel':''}" data-rv="${g.v}" data-rid="${r.id}">${g.label}<span class="rgl">${g.sub}</span></button>`;
    }).join('');
    return `<div class="rcard ${graded?'graded':''}" id="rcard-${r.id}">
      <div class="r-top"><div class="r-name"><div class="rn">${r.name}</div><div class="rsub">${sub}</div></div></div>
      <div class="rgrades">${btns}</div>
    </div>`;
  } else {
    const chosen = st!==undefined ? st.opt : -1;
    const isPos = chosen===r.posIndex;
    const opts = r.opts.map((o,i)=>{
      const sel = chosen===i;
      const pos = i===r.posIndex ? 1 : 0;
      return `<button class="popt ${sel?'sel':''}" data-pos="${pos}" data-ropt="${i}" data-rid="${r.id}">${o}</button>`;
    }).join('');
    return `<div class="rcard ${isPos?'umnpos':''}" id="rcard-${r.id}">
      <div class="r-top">
        <div class="r-name"><div class="rn">${r.name}</div><div class="rsub">${r.desc}</div></div>
        ${isPos?'<span class="r-umnbadge">UMN</span>':''}
      </div>
      <div class="path-opts">${opts}</div>
    </div>`;
  }
}
function bindReflexes(){
  document.querySelectorAll('.rgrade').forEach(b=>{
    b.onclick=()=>{
      const id=b.dataset.rid, v=parseFloat(b.dataset.rv);
      if(reflexState[id] && reflexState[id].v===v) delete reflexState[id];   // tap again to clear
      else reflexState[id]={v};
      const card=document.getElementById('rcard-'+id);
      const graded=reflexState[id]!==undefined;
      card.classList.toggle('graded', graded);
      card.querySelectorAll('.rgrade').forEach(x=>x.classList.toggle('sel', graded && parseFloat(x.dataset.rv)===reflexState[id].v));
      updateSummary();
    };
  });
  document.querySelectorAll('.popt').forEach(b=>{
    b.onclick=()=>{
      const id=b.dataset.rid, i=parseInt(b.dataset.ropt,10);
      const r=REFLEXES.find(x=>x.id===id);
      if(reflexState[id] && reflexState[id].opt===i) delete reflexState[id];   // tap again to clear
      else reflexState[id]={opt:i};
      const card=document.getElementById('rcard-'+id);
      const chosen=reflexState[id]!==undefined?reflexState[id].opt:-1;
      card.querySelectorAll('.popt').forEach(x=>x.classList.toggle('sel', parseInt(x.dataset.ropt,10)===chosen));
      card.classList.toggle('umnpos', chosen===r.posIndex);

      if(chosen===r.posIndex){ card.querySelector('.r-name').insertAdjacentHTML('afterend','<span class="r-umnbadge">UMN</span>'); }
      updateSummary();
    };
  });
}
function muscleCard(m){

  }).join('');
  return `<div class="muscle ${gradedCls} ${cls}" id="card-${m.id}">
    <div class="m-top">
      <div class="m-name">
        <div class="mn">${m.name}${m.sub?` <span style="font-weight:400;color:var(--text-faint);font-size:12px">· ${m.sub}</span>`:''}</div>

function detailTable(m){
  const rows=[];
  rows.push(['Peripheral n.', m.nerve]);
  if(m.region==='UE'){
    if(m.cord && m.cord.length) rows.push(['Cord', m.cord.map(c=>c+' cord').join(' / ')]);

  rows.push(['Roots', m.roots.join(', ')]);

  return `<div class="dtable">${rows.map(r=>`<div class="row"><div class="k">${r[0]}</div><div class="v">${r[1]}</div></div>`).join('')}</div>`;
}

function gradedList(){ return Object.keys(state).map(id=>({m:M.find(x=>x.id===id),g:state[id]})); }
function weakList(){ return gradedList().filter(x=>x.g.v<5); }
function sensList(){ return Object.keys(sensState).map(id=>SENS.find(s=>s.id===id)); }
function reflexList(){ return Object.keys(reflexState).map(id=>({r:REFLEXES.find(x=>x.id===id),s:reflexState[id]})); }

  if(all.length===0 && sens.length===0 && refl.length===0){ wl.innerHTML='Grade or mark only what you tested'; }
  else if(weak.length===0){ wl.innerHTML=(all.length?'<span style="color:var(--normal)">No weakness (all 5/5)</span>':'No motor tested')+sensBit+reflBit; }
  else { wl.innerHTML=`<span class="wk">${weak.length} weak</span> · ${weak.map(x=>x.m.name.split(' ')[0]).slice(0,2).join(', ')}${weak.length>2?'…':''}${sensBit}${reflBit}`; }
  document.getElementById('analyzeBtn').disabled = (all.length===0 && sens.length===0 && refl.length===0);
}

/* ---------------- localization engine ---------------- */
function intersect(arrays){
  if(!arrays.length) return [];
  return arrays.reduce((a,b)=> a.filter(x=>b.includes(x)));
}
function sortRoots(r){ return r.slice().sort((a,b)=>ROOT_ORDER.indexOf(a)-ROOT_ORDER.indexOf(b)); }

/* sensory analysis: dermatomes -> roots, cutaneous nerves -> nerve/plexus */
function analyzeSensory(){
  const items = sensList();
  if(!items.length) return {any:false, items:[], derm:[], nrv:[], dermRoots:[], nerveCommon:null, sensRootsAll:[]};
  const derm = items.filter(i=>i.type==='dermatome');
  const nrv  = items.filter(i=>i.type==='nerve');
  const dermRoots = sortRoots([...new Set(derm.map(d=>d.root))]);
  // most-distal cutaneous nerve common to all selected nerve items
  let nerveCommon=null;
  if(nrv.length){
    for(const cand of nrv[0].nerveChain){ if(nrv.every(n=>n.nerveChain.includes(cand))){ nerveCommon=cand; break; } }
  }
  // all roots implicated by any sensory finding (dermatome root + nerve roots)
  const sensRootsAll = sortRoots([...new Set([
    ...derm.map(d=>d.root),
    ...nrv.flatMap(n=>n.pred)
  ])]);
  // plexus elements implicated by selected cutaneous nerves
  let cord=[], trunk=[], plexus=[];
  nrv.forEach(n=>{
    if(n.cord) cord.push(...n.cord);
    if(n.trunk) trunk.push(n.trunk);
    if(n.plexus) plexus.push(n.plexus);
  });
  cord=[...new Set(cord)]; trunk=[...new Set(trunk)]; plexus=[...new Set(plexus)];
  return {any:true, items, derm, nrv, dermRoots, nerveCommon, sensRootsAll, cord, trunk, plexus};
}

/* reflex analysis: depressed DTRs localize LMN level; brisk DTRs + pathological signs flag UMN */
function analyzeReflexes(){
  const items = reflexList();
  if(!items.length) return {any:false, dtr:[], depressedRoots:[], briskItems:[], umnSigns:[], umnPresent:false};
  const dtr = items.filter(x=>x.r.type==='dtr');
  const path = items.filter(x=>x.r.type==='path');
  const depressed = dtr.filter(x=>x.s.v<=1);
  const brisk = dtr.filter(x=>x.s.v>=3);
  const depressedRoots = sortRoots([...new Set(depressed.flatMap(x=>x.r.pred))]);
  const umnSigns = [];
  brisk.forEach(x=>umnSigns.push(`${x.r.name} ${REFLEX_GRADES.find(g=>g.v===x.s.v).label}`));
  path.forEach(x=>{ if(x.s.opt===x.r.posIndex) umnSigns.push(`${x.r.name}: ${x.r.opts[x.s.opt]}`); });
  return {any:true, dtr, depressed, brisk, depressedRoots, umnSigns, umnPresent:umnSigns.length>0};
}

/* compare sensory findings against the motor localization, return HTML note + flags */
function sensoryConcordance(sens, motor){
  if(!sens.any) return {note:'', nerveMatch:false, rootMatch:[], rootFromSens:false};
  const {leadNerve, predInt, rootInt, region0} = motor;
  // nerve concordance: motor lead nerve sits within a selected cutaneous nerve's chain
  let nerveMatch=false, sharedNerve=null;
  if(leadNerve){
    for(const n of sens.nrv){ if(n.nerveChain.includes(leadNerve)){ nerveMatch=true; sharedNerve=leadNerve; break; } }
  }
  // root concordance: dermatome (or sensory-nerve root) overlapping the motor level
  const motorRoots = predInt.length?predInt:rootInt;
  const dermMatch = sens.dermRoots.filter(r=>motorRoots.includes(r));
  const nrvRootMatch = [...new Set(sens.nrv.flatMap(n=>n.pred))].filter(r=>motorRoots.includes(r));
  const rootMatch = sortRoots([...new Set([...dermMatch, ...nrvRootMatch])]);
  // assemble note
  const bits=[];
  // UE proximal-cutaneous teaching point (root vs plexus discriminator)
  const hasMABC = sens.items.some(i=>i.id==='nMABC'||i.id==='nMBC');
  if(region0==='UE' && hasMABC){
    bits.push(`involvement of the medial antebrachial / brachial cutaneous n. indicates a <span class="em">lower-trunk / medial-cord plexopathy</span> rather than a C8–T1 radiculopathy — these branches arise proximal to the foramen and are spared in root lesions`);
  }
  if(nerveMatch && dermMatch.length){
    bits.push(`loss in the ${sharedNerve} cutaneous field <em>and</em> the ${dermMatch.join('/')} dermatome — motor and sensory agree`);
  } else if(nerveMatch){
    bits.push(`sensory loss in the ${sharedNerve} cutaneous territory <span class="em">supports a peripheral ${sharedNerve} lesion</span> over a radiculopathy`);
  } else if(dermMatch.length){
    bits.push(`dermatomal sensory loss at <span class="em">${dermMatch.join('/')}</span> matches the motor level — supports a ${dermMatch.join('/')} root / plexus lesion over an isolated mononeuropathy`);
  } else if(sens.any && !hasMABC){
    const lab = sens.nerveCommon || (sens.dermRoots.length?sens.dermRoots.join('/')+' dermatome':'sensory');
    bits.push(`sensory loss (${lab}) does not overlap the motor territory — consider a separate level or a more diffuse process`);
  }
  return {note:bits.join('; ')+(bits.length?'.':''), nerveMatch, sharedNerve, rootMatch, rootFromSens:rootMatch.length>0 && !predInt.length};
}

/* sensory-only localization (no motor weakness recorded) */
function analyzeSupportOnly(sens, refl){
  const anchor = sens.any ? sens.items[0] : refl.dtr.concat(reflexList())[0].r;
  const region0 = (sens.any ? sens.items[0].region : reflexList()[0].r.region);
  const mixedRegion = false;
  let verdict, detail;
  const dr = sens.any ? sens.dermRoots : [], nc = sens.any ? sens.nerveCommon : null;
  const nrv = sens.any ? sens.nrv : [], derm = sens.any ? sens.derm : [];
  if(sens.any && nc && !derm.length){
    verdict='Sensory — peripheral nerve';
    detail=`Sensory loss is confined to the <span class="em">${nc}</span> cutaneous territory with no dermatomal pattern — favors a lesion of that peripheral (cutaneous) nerve. A pure sensory deficit also fits a sensory neuronopathy or early entrapment; correlate with motor exam and NCS.`;
  } else if(sens.any && derm.length && !nrv.length){
    if(dr.length===1){ verdict='Sensory — dermatomal'; detail=`Sensory loss follows the <span class="em">${dr[0]}</span> dermatome — favors a ${dr[0]} root (radicular) or ganglionopathy.`; }
    else { verdict='Sensory — multi-dermatomal'; detail=`Sensory loss spans the <span class="em">${dr.join(', ')}</span> dermatomes — favors a multi-level radiculopathy, plexopathy, or a sensory polyneuropathy if distal-predominant.`; }
  } else if(sens.any && derm.length && nrv.length){
    verdict='Sensory — mixed pattern';
    detail=`Sensory loss involves both dermatomal (${dr.join(', ')}) and cutaneous-nerve territories — localize against the motor exam; consider plexopathy or more than one process.`;
  } else if(refl.any){
    verdict = refl.umnPresent ? 'Reflexes — UMN pattern' : 'Reflex findings';
    detail = refl.umnPresent
      ? `Upper-motor-neuron signs are present without recorded weakness. This points to a corticospinal (central) process — cord, brainstem, or above. Grade the relevant muscles and test sensation to localize the level.`
      : `Reflex changes recorded${refl.depressedRoots.length?` — depressed at ${refl.depressedRoots.join(', ')}, consistent with an LMN lesion at that level`:''}. Grade the relevant muscles to converge on nerve vs root vs plexus.`;
  } else {
    verdict='Findings recorded';
    detail=`Grade the relevant muscles to converge on a localization.`;
  }
  // UMN overlay note
  if(refl.umnPresent && !verdict.startsWith('Reflexes')){
    detail += ` <span class="em">UMN signs also present</span> (${refl.umnSigns.join('; ')}) — consider a coexisting central process.`;
  }
  return {empty:false, supportOnly:true, weak:[], spared:[], mixedRegion, region:region0,
    rootInt:dr, predInt:dr, commonNerve:nc, nerveIsTrunkOnly:false,
    cordInt:sens.any?sens.cord:[], trunkInt:sens.any?sens.trunk:[], plexusInt:sens.any?sens.plexus:[],
    nerveTerr:null, rootTerr:null, leadRoots:dr,
    verdict, detail, sens, refl, umnPresent:refl.umnPresent,
    sensConcord:{note:'',nerveMatch:false,rootMatch:[],rootFromSens:false}};
}

function analyze(){
  const weak = weakList();
  const spared = gradedList().filter(x=>x.g.v===5);
  const sens = analyzeSensory();
  const refl = analyzeReflexes();
  if(!weak.length){
    // no motor weakness — sensory and/or reflex findings can still localize
    if(sens.any || refl.any) return analyzeSupportOnly(sens, refl);
    return {empty:true, allNormal: gradedList().length>0};
  }
  const region0 = weak[0].m.region;
  const mixedRegion = weak.some(x=>x.m.region!==region0);

  // root intersection (all contributing) + predominant intersection
  const rootInt = sortRoots(intersect(weak.map(x=>x.m.roots)));
  const predInt = sortRoots(intersect(weak.map(x=>x.m.pred)));

  // most distal common peripheral nerve via chains
  const chains = weak.map(x=>x.m.nerveChain);
  let commonNerve=null;
  for(const cand of chains[0]){ if(chains.every(c=>c.includes(cand))){ commonNerve=cand; break; } }

  // plexus elements
  let cordInt=null, trunkInt=null, plexusInt=null;
  if(region0==='UE' && !mixedRegion){
    cordInt = intersect(weak.map(x=>x.m.cord && x.m.cord.length?x.m.cord:['*none*']));
    if(cordInt.includes('*none*')) cordInt=[];
    const trunks = weak.map(x=>x.m.trunk).filter(Boolean);
    trunkInt = (trunks.length===weak.length && trunks.length) ? [...new Set(trunks)] : [];
    if(trunkInt.length!==1) trunkInt=[];
  } else if(region0==='LE' && !mixedRegion){
    const px = weak.map(x=>x.m.plexus).filter(Boolean);
    plexusInt = (px.length===weak.length)?[...new Set(px)]:[];
  }

  // candidate territory analysis for the leading nerve and leading root
  const leadNerve = commonNerve;
  const leadRoots = predInt.length?predInt:rootInt;

  function territory(filterFn){
    const inTerr = M.filter(filterFn);
    const w=[],s=[],u=[];
    inTerr.forEach(m=>{ const g=state[m.id];
      if(g && g.v<5) w.push({m,g}); else if(g && g.v===5) s.push({m,g}); else u.push({m}); });
    return {w,s,u};
  }
  const nerveTerr = leadNerve? territory(m=>m.nerveChain.includes(leadNerve)) : null;
  const rootTerr = leadRoots.length? territory(m=>leadRoots.every(r=>m.roots.includes(r))) : null;

  // interpretation logic
  const singleNerve = !!leadNerve;
  const nerveIsTrunkOnly = leadNerve && leadNerve==='Sciatic n.'; // proximal — sciatic trunk, not a discrete branch
  const rootsConverge = predInt.length>0;
  const multiWeak = weak.length>1;
  // plexus-element label for this region
  let plxLabel=null;
  if(region0==='UE'){
    if(trunkInt&&trunkInt.length) plxLabel=trunkInt[0]+' trunk';
    else if(cordInt&&cordInt.length) plxLabel=cordInt.map(c=>c+' cord').join('/');
  } else if(region0==='LE'){
    if(plexusInt&&plexusInt.length) plxLabel=plexusInt[0];
  }

  let verdict, detail;
  if(!multiWeak){
    verdict='Single muscle';
    detail=`Only one weak muscle recorded — localizes to its territory: <span class="em">${leadNerve}</span>, root ${weak[0].m.pred.join('–')}. Grade neighbouring muscles to converge on nerve vs root vs plexus.`;
  } else if(singleNerve && nerveIsTrunkOnly){
    verdict='Proximal nerve (sciatic) pattern';
    detail=`All weak muscles fall within the <span class="em">sciatic n.</span> distribution (knee flexors plus everything below the knee). If gluteal muscles (superior/inferior gluteal) and hip adductors are spared, the lesion sits at or distal to the sciatic n. rather than the lumbosacral plexus or roots.`;
  } else if(singleNerve && rootsConverge){
    verdict='Nerve vs root';
    detail=`Weak muscles share both <span class="em">${leadNerve}</span> and root level <span class="em">${predInt.join('–')}</span>. Either a ${leadNerve} lesion or a ${predInt.join('/')} radiculopathy fits — grade a muscle at the same root but a <i>different</i> nerve to separate them.`;
  } else if(singleNerve && !rootsConverge){
    verdict='Mononeuropathy pattern';
    detail=`All weak muscles share <span class="em">${leadNerve}</span> while spanning more than one root level — favors a lesion of that peripheral nerve over a single root or plexus element.${leadNerve.indexOf('peroneal')>-1?' For foot drop, a spared tibialis posterior (tibial, L5) points to a peroneal lesion rather than L5 radiculopathy.':''}`;
  } else if(!singleNerve && rootsConverge){
    verdict = plxLabel ? 'Plexus vs root' : 'Radiculopathy pattern';
    detail=`Weak muscles cross several peripheral nerves but share root level <span class="em">${predInt.join('–')}</span>${plxLabel?` and the <span class="em">${plxLabel}</span>`:''}. Favors a ${predInt.join('/')} radiculopathy${plxLabel?` or ${plxLabel} plexopathy`:''}.${region0==='UE'?' Pre-plexus muscles (rhomboids C5, serratus anterior C5–7) help separate root from plexus — weak = root level, spared = plexus.':''}`;
  } else {
    verdict='Multifocal / non-converging';
    detail=`Weak muscles do not share a single nerve or root. Consider polyradiculopathy, plexopathy, mononeuritis multiplex, or a non-peripheral (e.g. central / motor neuron) process. Correlate with reflexes, sensory level, and UMN signs.`;
  }

  // sensory concordance with the motor pattern
  const sensConcord = sensoryConcordance(sens, {leadNerve, predInt, rootInt, region0, cordInt, trunkInt, plexusInt});
  if(sensConcord.note){ detail += ` <span class="em">Sensory:</span> ${sensConcord.note}`; }

  // reflex concordance: depressed DTR at the motor level supports the LMN lesion
  if(refl.any){
    const motorRoots = predInt.length?predInt:rootInt;
    const reflMatch = refl.depressedRoots.filter(r=>motorRoots.includes(r));
    if(reflMatch.length){
      detail += ` <span class="em">Reflexes:</span> depressed reflex at ${reflMatch.join('/')} matches the motor level, supporting an LMN (root/peripheral) lesion.`;
    } else if(refl.depressedRoots.length){
      detail += ` <span class="em">Reflexes:</span> depressed at ${refl.depressedRoots.join('/')} (does not overlap the motor level — consider a separate level).`;
    }
  }

  return {
    empty:false, weak, spared, mixedRegion, region:region0,
    rootInt, predInt, commonNerve:leadNerve, nerveIsTrunkOnly,
    cordInt, trunkInt, plexusInt, nerveTerr, rootTerr, leadRoots,
    verdict, detail, sens, sensConcord, refl, umnPresent:refl.umnPresent
  };
}

/* ---------------- result rendering ---------------- */
function chip(item, kind){
  const g=item.g?` <span class="gr">${item.g.label}</span>`:'';
  return `<span class="chip ${kind}">${item.m.name.replace(/ \(.*?\)/,'')}${g}</span>`;
}
function renderResults(){
  const r=analyze();
  const body=document.getElementById('sheetBody');
  if(r.empty){
    body.innerHTML=`<div class="empty-res"><div class="big">${r.allNormal?'All graded muscles are 5/5':'Nothing recorded yet'}</div>${r.allNormal?'No weakness to localize. Lower a grade or mark a sensory deficit if found.':'Grade the muscles you tested or mark sensory deficits, then localize.'}</div>`;
    return;
  }
  let h='';
  if(r.umnPresent){
    const signs = (r.refl && r.refl.umnSigns) ? r.refl.umnSigns.join('; ') : '';
    h+=`<div class="umn-banner"><div class="ub-h"><span class="ico">!</span>Upper-motor-neuron signs present</div><div class="ub-body">Corticospinal (UMN) signs indicate a <b>central</b> process at or above the affected segment — spinal cord, brainstem, or brain — rather than a pure peripheral lesion. The peripheral pattern below may be a separate or coexisting process; weigh the whole picture and image the neuraxis as indicated.</div><div class="ub-list">Signs: ${signs}</div></div>`;
  }
  if(r.mixedRegion){
    h+=`<div class="note-warn"><span class="i">!</span><div>Weak muscles span <b>both upper and lower limbs</b>. Peripheral localization assumes one limb/territory — a generalized or central process should be considered. Analysis below uses the predominant limb.</div></div>`;
  }

  // primary localization block
  const sc = r.sensConcord || {};
  const nerveTag = sc.nerveMatch ? ` <span class="tag" style="background:var(--purple-soft);color:var(--purple);border-color:rgba(167,139,250,.4)">+ sensory</span>` : '';
  const rootTag = (sc.rootMatch && sc.rootMatch.length) ? ` <span class="tag" style="background:var(--purple-soft);color:var(--purple);border-color:rgba(167,139,250,.4)">+ sensory ${sc.rootMatch.join('/')}</span>` : '';
  h+=`<div class="rb loc-primary"><div class="rb-title">Common denominator</div>`;
  h+=`<div class="loc-line"><div class="loc-k">Peripheral nerve</div><div class="loc-v big">${r.commonNerve?`<span class="mono">${r.commonNerve}</span>${r.nerveIsTrunkOnly?' <span class="none">(proximal — trunk-level)</span>':''}${nerveTag}`:'<span class="none">no single shared nerve</span>'}</div></div>`;
  h+=`<div class="loc-line"><div class="loc-k">Nerve root</div><div class="loc-v big">${r.predInt.length?`<span class="mono">${r.predInt.join('–')}</span>${rootTag}`:(r.rootInt.length?`<span class="mono">${r.rootInt.join('–')}</span> <span class="none">(broad)</span>${rootTag}`:'<span class="none">no single shared level</span>')}</div></div>`;
  if(r.region==='UE'){
    const plxBits=[];
    if(r.trunkInt&&r.trunkInt.length) plxBits.push(r.trunkInt[0]+' trunk');
    if(r.cordInt&&r.cordInt.length) plxBits.push(r.cordInt.map(c=>c+' cord').join(' / '));
    h+=`<div class="loc-line"><div class="loc-k">Brachial plexus</div><div class="loc-v">${plxBits.length?`<span class="mono" style="font-size:14px">${plxBits.join(' · ')}</span>`:'<span class="none">no single shared element</span>'}</div></div>`;
  } else {
    h+=`<div class="loc-line"><div class="loc-k">Lumbosacral</div><div class="loc-v">${(r.plexusInt&&r.plexusInt.length)?`<span class="mono" style="font-size:14px">${r.plexusInt[0]}</span>`:'<span class="none">spans lumbar + sacral</span>'}</div></div>`;
  }
  h+=`</div>`;

  // interpretation
  h+=`<div class="rb"><div class="rb-title">Interpretation — ${r.verdict}</div><div class="interp">${r.detail}</div></div>`;

  // weak muscles (motor)
  if(r.weak.length){
    h+=`<div class="rb"><div class="rb-title">Weak muscles (${r.weak.length})</div><div class="chip-row">${r.weak.map(x=>chip(x,'w')).join('')}</div></div>`;
  }

  // sensory findings block
  if(r.sens && r.sens.any){
    h+=`<div class="rb"><div class="rb-title">Sensory deficits (${r.sens.items.length})</div>`;
    if(r.sens.derm.length){
      h+=`<div class="suggest" style="margin-bottom:5px"><b>Dermatomal</b> → roots ${r.sens.dermRoots.join(', ')}:</div><div class="chip-row" style="margin-bottom:9px">${r.sens.derm.map(d=>`<span class="chip w">${d.name.replace(' dermatome','')}</span>`).join('')}</div>`;
    }
    if(r.sens.nrv.length){
      h+=`<div class="suggest" style="margin-bottom:5px"><b>Cutaneous nerve</b>${r.sens.nerveCommon?` → ${r.sens.nerveCommon}`:''}:</div><div class="chip-row">${r.sens.nrv.map(n=>`<span class="chip w">${n.name.split(' —')[0]}</span>`).join('')}</div>`;
    }
    h+=`</div>`;
  }

  // reflex findings block
  if(r.refl && r.refl.any){
    const dtrTxt = (x)=>{
      const g=REFLEX_GRADES.find(g=>g.v===x.s.v);
      const cls = x.s.v<=1?'w':(x.s.v>=3?'w':'s');
      return `<span class="chip ${cls}">${x.r.name} ${g.label}</span>`;
    };
    h+=`<div class="rb"><div class="rb-title">Reflexes (${r.refl.dtr.length + (r.refl.umnSigns?r.refl.umnSigns.filter(s=>s.includes(':')).length:0)})</div>`;
    if(r.refl.dtr.length){
      h+=`<div class="suggest" style="margin-bottom:5px"><b>Stretch reflexes</b>${r.refl.depressedRoots.length?` — depressed implicates ${r.refl.depressedRoots.join(', ')}`:''}:</div><div class="chip-row" style="margin-bottom:9px">${r.refl.dtr.map(dtrTxt).join('')}</div>`;
    }
    if(r.refl.umnSigns && r.refl.umnSigns.length){
      h+=`<div class="suggest" style="margin-bottom:5px"><b>UMN signs</b> (corticospinal):</div><div class="chip-row">${r.refl.umnSigns.map(s=>`<span class="chip w">${s}</span>`).join('')}</div>`;
    }
    h+=`</div>`;
  }
  if(r.nerveTerr && r.commonNerve){
    const t=r.nerveTerr;
    h+=`<div class="rb"><div class="rb-title">${r.commonNerve} territory</div>`;
    if(t.s.length) h+=`<div class="suggest" style="margin-bottom:7px"><b>Spared (5/5) in this nerve</b> — argues against a complete lesion (partial still possible):</div><div class="chip-row" style="margin-bottom:9px">${t.s.map(x=>chip(x,'s')).join('')}</div>`;
    if(t.u.length) h+=`<div class="suggest"><b>Not yet tested in this nerve</b> — grading these tightens the level:</div><div class="chip-row">${t.u.map(x=>chip(x,'u')).join('')}</div>`;
    if(!t.s.length && !t.u.length) h+=`<div class="suggest">All muscles in this nerve's territory are weak — consistent with a lesion at or above the take-off of this nerve.</div>`;
    h+=`</div>`;
  }
  // territory for leading root
  if(r.rootTerr && r.leadRoots.length){
    const t=r.rootTerr;
    h+=`<div class="rb"><div class="rb-title">${r.leadRoots.join('–')} myotome</div>`;
    const otherWeak=t.w.filter(x=>!r.weak.find(w=>w.m.id===x.m.id));
    if(otherWeak.length) h+=`<div class="suggest" style="margin-bottom:7px"><b>Also weak at this level</b> (via other nerves — supports a root/plexus lesion):</div><div class="chip-row" style="margin-bottom:9px">${otherWeak.map(x=>chip(x,'w')).join('')}</div>`;
    if(t.s.length) h+=`<div class="suggest" style="margin-bottom:7px"><b>Spared at this level</b>:</div><div class="chip-row" style="margin-bottom:9px">${t.s.map(x=>chip(x,'s')).join('')}</div>`;
    if(t.u.length) h+=`<div class="suggest"><b>Untested at this level</b> — esp. a different-nerve muscle to separate root vs single nerve:</div><div class="chip-row">${t.u.map(x=>chip(x,'u')).join('')}</div>`;
    h+=`</div>`;
  }

  h+=`<div class="refs">Motor innervations per <b>Aids to the Examination of the Peripheral Nervous System</b> (MRC) and <b>Preston &amp; Shapiro</b> EMG/NCS; sensory dermatomes are a standard composite map (Foerster / ASIA) and cutaneous nerve fields per <b>Preston &amp; Shapiro</b> and <b>Patten</b>. Dermatome and cutaneous territories overlap substantially. Predominant roots reflect the levels most emphasized clinically; contributing levels are broader.</div>`;
  h+=`<div class="disclaimer">Decision-support / teaching aid for trained clinicians. Reflexes, UMN signs, and EMG/NCS are still required to confirm localization. The clinician interprets all output.</div>`;
  body.innerHTML=h;
}

/* ---------------- copy note ---------------- */
function buildNote(){
  const r=analyze();
  const all=gradedList();
  const sens=sensList();
  let lines=['PERIPHERAL EXAM'];
  if(all.length){
    lines.push('Motor (MRC):');
    ['UE','LE'].forEach(reg=>{
      const rows=all.filter(x=>x.m.region===reg);
      if(!rows.length) return;
      lines.push((reg==='UE'?'  Upper limb:':'  Lower limb:'));
      rows.forEach(x=>lines.push(`    ${x.m.name}: ${x.g.label}/5  (${x.m.nerve}, ${x.m.pred.join('-')})`));
    });
  }
  if(sens.length){
    lines.push('Sensory (reduced):');
    ['UE','LE'].forEach(reg=>{
      const rows=sens.filter(s=>s.region===reg);
      if(!rows.length) return;
      lines.push((reg==='UE'?'  Upper limb:':'  Lower limb:'));
      rows.forEach(s=>{
        const loc = s.type==='dermatome'?`root ${s.root}`:`${s.nerve}, ${s.pred.join('-')}`;
        lines.push(`    ${s.name}: \u2193  (${loc})`);
      });
    });
  }
  const refl=reflexList();
  if(refl.length){
    const dtr=refl.filter(x=>x.r.type==='dtr');
    const path=refl.filter(x=>x.r.type==='path');
    lines.push('Reflexes:');
    if(dtr.length){
      lines.push('  Stretch reflexes:');
      dtr.forEach(x=>{
        const g=REFLEX_GRADES.find(g=>g.v===x.s.v);
        lines.push(`    ${x.r.name}: ${g.label}  (${x.r.pred.join('-')})`);
      });
    }
    if(path.length){
      lines.push('  Pathological/UMN:');
      path.forEach(x=>lines.push(`    ${x.r.name}: ${x.r.opts[x.s.opt]}`));
    }
    if(r.refl && r.refl.umnPresent) lines.push(`  >> UMN signs present (${r.refl.umnSigns.join('; ')}) - consider central process.`);
  }
  lines.push('');
  if(r.empty){
    lines.push(r.allNormal?'Localization: no deficit recorded.':'Localization: pending.');
  } else {
    lines.push('LOCALIZATION:');
    lines.push(`  Shared nerve : ${r.commonNerve||'none'}`);
    lines.push(`  Shared root  : ${r.predInt.length?r.predInt.join('-'):(r.rootInt.length?r.rootInt.join('-')+' (broad)':'none')}`);
    if(r.region==='UE'){
      const p=[]; if(r.trunkInt&&r.trunkInt.length)p.push(r.trunkInt[0]+' trunk'); if(r.cordInt&&r.cordInt.length)p.push(r.cordInt.map(c=>c+' cord').join('/'));
      lines.push(`  Plexus       : ${p.length?p.join(', '):'none'}`);
    } else {
      lines.push(`  Plexus       : ${(r.plexusInt&&r.plexusInt.length)?r.plexusInt[0]:'lumbar+sacral'}`);
    }
    if(r.sens && r.sens.any){
      if(r.sens.dermRoots.length) lines.push(`  Sens. derm.  : ${r.sens.dermRoots.join(', ')}`);
      if(r.sens.nerveCommon) lines.push(`  Sens. nerve  : ${r.sens.nerveCommon}`);
    }
    lines.push(`  Impression   : ${r.verdict}`);
  }
  lines.push('');
  lines.push('(Correlate reflexes, UMN signs, EMG/NCS.)');
  return lines.join('\n');
}

/* ---------------- UI wiring ---------------- */
const sheet=document.getElementById('sheet'), scrim=document.getElementById('scrim');
function openSheet(){ renderResults(); scrim.classList.add('show'); sheet.classList.add('show'); }
function closeSheet(){ scrim.classList.remove('show'); sheet.classList.remove('show'); }
document.getElementById('analyzeBtn').onclick=openSheet;
document.getElementById('closeSheet').onclick=closeSheet;
scrim.onclick=closeSheet;

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active'); region=t.dataset.region; render();
    window.scrollTo({top:0,behavior:'instant'});
  };
});

document.querySelectorAll('.seg').forEach(s=>{
  s.onclick=()=>{
    document.querySelectorAll('.seg').forEach(x=>x.classList.remove('active'));
    s.classList.add('active'); mode=s.dataset.mode; render();
    window.scrollTo({top:0,behavior:'instant'});
  };
});

document.getElementById('themeBtn').onclick=()=>{
  const html=document.documentElement;
  html.dataset.theme = html.dataset.theme==='dark'?'light':'dark';
};

function resetAll(){
  for(const k in state) delete state[k];
  for(const k in sensState) delete sensState[k];
  for(const k in reflexState) delete reflexState[k];
  render(); renderResults(); toast('Exam cleared');
}
document.getElementById('resetBtn').onclick=resetAll;
document.getElementById('resetTop').onclick=resetAll;

const lb=document.getElementById('lightbox');
document.getElementById('lbX').onclick=()=>lb.classList.remove('show');
lb.onclick=(e)=>{ if(e.target===lb) lb.classList.remove('show'); };
document.getElementById('copyBtn').onclick=async()=>{
  const note=buildNote();
  try{ await navigator.clipboard.writeText(note); toast('Note copied'); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=note; document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy'); toast('Note copied');}catch(_){toast('Copy failed');}
    document.body.removeChild(ta);
  }
};
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1600); }

render();
</script>
