<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2024 McDonald Criteria — MS Diagnosis</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&family=Lexend:wght@300;400;500;600&display=swap');

:root {
  --bg:        #0d1117;
  --card:      #161b22;
  --card2:     #1c2330;
  --border:    #3a4556;
  --border2:   #4a5f7a;
  --green:     #3fb950;
  --green-bg:  rgba(63,185,80,0.10);
  --green-bd:  rgba(63,185,80,0.35);
  --red:       #f85149;
  --red-bg:    rgba(248,81,73,0.10);
  --red-bd:    rgba(248,81,73,0.35);
  --amber:     #e3b341;
  --amber-bg:  rgba(227,179,65,0.10);
  --amber-bd:  rgba(227,179,65,0.35);
  --blue:      #58a6ff;
  --blue-bg:   rgba(88,166,255,0.10);
  --blue-bd:   rgba(88,166,255,0.35);
  --purple:    #bc8cff;
  --purple-bg: rgba(188,140,255,0.10);
  --purple-bd: rgba(188,140,255,0.35);
  --teal:      #39d0b0;
  --teal-bg:   rgba(57,208,176,0.10);
  --teal-bd:   rgba(57,208,176,0.35);
  --text:      #e6edf3;
  --text2:     #aab4c0;
  --text3:     #6e7f94;
  --sans: 'Lexend', 'Inter', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5; min-height: 100vh; }
.app { max-width: 820px; margin: 0 auto; padding: 0 20px 80px; }

/* HEADER */
header { padding: 22px 0 14px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.h-badge { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.badge { background: var(--blue-bg); border: 1px solid var(--blue-bd); color: var(--blue); font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px; font-family: var(--sans); letter-spacing: 0.04em; }
.badge-new { background: var(--green-bg); border: 1px solid var(--green-bd); color: var(--green); font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; font-family: var(--sans); }
.h-title { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
.h-title span { color: var(--teal); }
.h-sub { font-family: var(--sans); font-size: 11px; color: var(--text3); line-height: 1.6; }
.h-credit { font-family: var(--sans); font-size: 11px; color: var(--text3); margin-top: 2px; }

/* PROGRESS */
.prog-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
.prog-track { flex: 1; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.prog-fill { height: 100%; background: linear-gradient(90deg, var(--teal), #58efd4); border-radius: 2px; transition: width 0.4s ease; box-shadow: 0 0 6px rgba(57,208,176,0.4); }
.prog-label { font-family: var(--mono); font-size: 11px; color: var(--text3); white-space: nowrap; }

/* BREADCRUMB */
.bread { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.bc { font-size: 11px; color: var(--text3); background: var(--card2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; font-family: var(--sans); }
.bc.cur { color: var(--teal); border-color: var(--teal-bd); background: var(--teal-bg); }
.bcsep { color: var(--text3); font-size: 11px; }

/* CARD */
.sc { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px 22px; margin-bottom: 12px; animation: fu 0.22s ease; }
@keyframes fu { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }

/* SECTION LABEL */
.slabel { font-family: var(--sans); font-size: 11px; font-weight: 600; color: var(--teal); letter-spacing: 0; text-transform: none; margin-bottom: 6px; }

/* QUESTION */
.sq { font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.45; margin-bottom: 10px; }

/* NOTE BOX */
.snote { font-size: 12px; color: var(--text2); line-height: 1.6; padding: 9px 12px; background: var(--card2); border-radius: 5px; border-left: 3px solid var(--blue); margin-bottom: 10px; }
.snote.warn  { border-left-color: var(--amber); }
.snote.green { border-left-color: var(--green); background: var(--green-bg); }
.snote.purple{ border-left-color: var(--purple); background: var(--purple-bg); }
.snote.red   { border-left-color: var(--red); background: var(--red-bg); }
.snote strong { color: var(--text); }

/* NEW 2024 BADGE */
.n24 { display: inline-block; background: var(--green-bg); border: 1px solid var(--green-bd); color: var(--green); font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 3px; margin-left: 5px; vertical-align: middle; font-family: var(--sans); }

/* RADIO OPTIONS */
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { background: var(--card2); border: 1px solid var(--border2); border-radius: 6px; color: var(--text); font-size: 13px; padding: 10px 13px; text-align: left; cursor: pointer; transition: all 0.13s; display: flex; align-items: center; gap: 10px; line-height: 1.4; font-family: var(--sans); font-weight: 400; }
.opt:hover { background: var(--card); border-color: var(--teal); }
.opt.sel { background: var(--teal-bg); border-color: var(--teal-bd); }
.rdot { width: 16px; height: 16px; min-width: 16px; border-radius: 50%; border: 1.5px solid var(--border2); background: var(--card); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.13s; }
.opt.sel .rdot { background: var(--teal); border-color: var(--teal); }
.ri { width: 6px; height: 6px; border-radius: 50%; background: white; display: none; }
.opt.sel .ri { display: block; }

/* CHECKBOX OPTIONS */
.copts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
.copt { background: var(--card2); border: 1px solid var(--border2); border-radius: 6px; color: var(--text); font-size: 13px; padding: 10px 13px; text-align: left; cursor: pointer; transition: all 0.13s; display: flex; align-items: flex-start; gap: 10px; line-height: 1.4; font-family: var(--sans); font-weight: 400; }
.copt:hover { background: var(--card); border-color: var(--teal); }
.copt.chk { background: var(--teal-bg); border-color: var(--teal-bd); }
.cbox { width: 16px; height: 16px; min-width: 16px; border-radius: 3px; border: 1.5px solid var(--border2); background: var(--card); display: flex; align-items: center; justify-content: center; margin-top: 1px; font-size: 11px; color: white; flex-shrink: 0; transition: all 0.13s; }
.copt.chk .cbox { background: var(--teal); border-color: var(--teal); }
.mn { font-size: 11px; color: var(--text3); margin-top: 5px; font-family: var(--sans); }

/* ACTION ROW / BUTTONS */
.arow { display: flex; gap: 9px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
.bp { background: var(--teal); border: none; border-radius: 6px; color: #0d1117; font-size: 13px; font-weight: 700; padding: 9px 20px; cursor: pointer; transition: all 0.13s; font-family: var(--sans); }
.bp:hover { background: #58efd4; }
.bp:disabled { opacity: 0.3; cursor: not-allowed; }
.bs { background: transparent; border: 1px solid var(--border2); border-radius: 6px; color: var(--text2); font-size: 13px; padding: 8px 16px; cursor: pointer; transition: all 0.13s; font-family: var(--sans); }
.bs:hover { color: var(--text); background: var(--card2); border-color: var(--border); }

/* BIOMARKER BOX */
.bm-box { background: var(--card2); border: 1px solid var(--border); border-radius: 6px; padding: 13px 15px; margin-bottom: 10px; }
.bm-title { font-size: 11px; font-weight: 600; color: var(--text3); margin-bottom: 9px; font-family: var(--sans); letter-spacing: 0; text-transform: none; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.bm-row { display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.bm-row:last-child { border-bottom: none; }
.bm-k { color: var(--text3); flex: 0 0 115px; font-family: var(--sans); }
.bm-v { color: var(--text2); flex: 1; line-height: 1.45; }
.bm-v strong { color: var(--text); }

/* STATUS CHIPS */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 20px; margin: 2px; font-family: var(--sans); }
.chip-green  { background: var(--green-bg);  border: 1px solid var(--green-bd);  color: var(--green); }
.chip-red    { background: var(--red-bg);    border: 1px solid var(--red-bd);    color: var(--red); }
.chip-amber  { background: var(--amber-bg);  border: 1px solid var(--amber-bd);  color: var(--amber); }
.chip-blue   { background: var(--blue-bg);   border: 1px solid var(--blue-bd);   color: var(--blue); }
.chip-purple { background: var(--purple-bg); border: 1px solid var(--purple-bd); color: var(--purple); }
.chip-teal   { background: var(--teal-bg);   border: 1px solid var(--teal-bd);   color: var(--teal); }

/* RESULT CARDS */
.rc { border-radius: 8px; padding: 20px 22px; margin-bottom: 12px; animation: fu 0.3s ease; border: 1px solid; }
.r-green  { background: var(--green-bg);  border-color: var(--green-bd); }
.r-amber  { background: var(--amber-bg);  border-color: var(--amber-bd); }
.r-red    { background: var(--red-bg);    border-color: var(--red-bd); }
.r-purple { background: var(--purple-bg); border-color: var(--purple-bd); }
.r-blue   { background: var(--blue-bg);   border-color: var(--blue-bd); }
.r-teal   { background: var(--teal-bg);   border-color: var(--teal-bd); }
.rtitle { font-size: 16px; font-weight: 700; margin-bottom: 7px; display: flex; align-items: center; gap: 9px; font-family: var(--sans); }
.r-green  .rtitle { color: var(--green); }
.r-amber  .rtitle { color: var(--amber); }
.r-red    .rtitle { color: var(--red); }
.r-purple .rtitle { color: var(--purple); }
.r-blue   .rtitle { color: var(--blue); }
.r-teal   .rtitle { color: var(--teal); }
.rico { width: 22px; height: 22px; min-width: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
.r-green  .rico { background: var(--green);  color: #0d1117; }
.r-amber  .rico { background: var(--amber);  color: #0d1117; }
.r-red    .rico { background: var(--red);    color: #0d1117; }
.r-purple .rico { background: var(--purple); color: #0d1117; }
.r-blue   .rico { background: var(--blue);   color: #0d1117; }
.r-teal   .rico { background: var(--teal);   color: #0d1117; }
.richd { font-size: 10px; font-weight: 600; opacity: 0.7; margin-bottom: 4px; font-family: var(--sans); letter-spacing: 0; }
.rbody { font-size: 13px; color: var(--text2); line-height: 1.7; font-family: var(--sans); }
.rbody ul { margin: 8px 0 0 16px; }
.rbody li { margin-bottom: 5px; }
.rbody strong { color: var(--text); }

/* SUMMARY CARD */
.sum-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px 18px; margin-bottom: 12px; }
.sum-title { font-size: 11px; font-weight: 600; color: var(--text3); margin-bottom: 10px; font-family: var(--sans); letter-spacing: 0; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.sum-row { display: flex; align-items: flex-start; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.sum-row:last-child { border-bottom: none; }
.sum-k { color: var(--text2); flex: 1; line-height: 1.4; font-family: var(--sans); }
.sum-v { color: var(--text); font-weight: 500; text-align: right; font-size: 12px; font-family: var(--sans); }
.sum-v.yes  { color: var(--green); }
.sum-v.no   { color: var(--red); }
.sum-v.part { color: var(--amber); }

/* DOCUMENTATION NOTE */
.doc-tog { width: 100%; text-align: left; background: var(--card2); border: 1px solid var(--border); border-radius: 6px; color: var(--text2); font-family: var(--sans); font-size: 13px; padding: 9px 14px; cursor: pointer; margin-top: 10px; margin-bottom: 4px; transition: all 0.15s; }
.doc-tog:hover { border-color: var(--teal); color: var(--teal); }
.doc-body { display: none; background: var(--card2); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; font-family: var(--mono); font-size: 11px; color: var(--text2); line-height: 1.85; white-space: pre-wrap; margin-bottom: 8px; }
.doc-body.open { display: block; }

@media (max-width: 520px) { .app { padding: 0 12px 60px; } .sq { font-size: 14px; } }
</style>
</head>
<body>
<div class="app">

<header>
  <div class="h-badge">
    <span class="badge">Neuroimmunology</span>
    <span class="badge-new">2024 McDonald Criteria</span>
  </div>
  <div class="h-title">MS Diagnosis — <span>2024 McDonald Criteria</span></div>
  <div class="h-sub">κFLC · Central Vein Sign · Paramagnetic Rim Lesions · RIS pathway · For educator use only</div>
  <div class="h-credit">Designed by neurology resident physician Daniel Short, MD</div>
</header>

<div class="prog-wrap">
  <div class="prog-track"><div class="prog-fill" id="pFill" style="width:0%"></div></div>
  <div class="prog-label" id="pLabel">Step 1</div>
</div>

<div id="main"></div>

</div>
<script>

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
var S = { phase:'prereq', answers:{}, trail:[] };
function advance(to){ S.trail.push(S.phase); S.phase=to; render(); }
function back(){ if(S.trail.length){ S.phase=S.trail.pop(); render(); } }
function restart(){ S={phase:'prereq',answers:{},trail:[]}; render(); }

var PHASES = ['prereq','age_comorbid','presentation','attacks','mri_dit','dis_locations','optic_nerve','csf_lp','csf_ocb','csf_kflc','cvs','prl','exclusion','ppms_worsening','ppms_criteria','result'];
function pIdx(){ return PHASES.indexOf(S.phase); }
function upP(){
  var i=pIdx(), tot=PHASES.length-2;
  var pct=i<0?100:Math.min(100,Math.round((i/tot)*100));
  document.getElementById('pFill').style.width=pct+'%';
  document.getElementById('pLabel').textContent=i<0?'Complete':'Step '+(i+1);
}

// ═══════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════
var LABELS={prereq:'Presentation',age_comorbid:'Age/comorbid',presentation:'Syndrome',attacks:'Attacks',mri_dit:'MRI DIT',dis_locations:'DIS locations',optic_nerve:'Optic nerve',csf_lp:'LP performed?',csf_ocb:'OCBs',csf_kflc:'κFLC',cvs:'Central Vein Sign',prl:'Param. Rim Lesions',exclusion:'Exclusions',ppms_worsening:'Progression',ppms_criteria:'PPMS criteria',result:'Result'};
function bread(cur){
  if(!S.trail.length) return '';
  var h='<div class="bread">';
  S.trail.slice(-4).forEach(function(p){ h+='<span class="bc">'+(LABELS[p]||p)+'</span><span class="bcsep">›</span>'; });
  h+='<span class="bc cur">'+(LABELS[cur]||cur)+'</span></div>';
  return h;
}
function bb(){ return S.trail.length ? '<button class="bs" onclick="back()">Back</button>' : ''; }
function n24(){ return '<span class="n24">2024</span>'; }
function chip(cls,txt){ return '<span class="chip chip-'+cls+'">'+txt+'</span>'; }

// Radio step
function radioStep(lbl,q,note,ncls,key,opts,cb){
  var cur=S.answers[key];
  var h='<div class="sc"><div class="slabel">'+lbl+'</div><div class="sq">'+q+'</div>';
  if(note) h+='<div class="snote'+(ncls?' '+ncls:'')+'">'+note+'</div>';
  h+='<div class="opts" id="ro_'+key+'">';
  opts.forEach(function(o,i){ var s=cur===o.val?' sel':''; h+='<button class="opt'+s+'" onclick="pR(\''+key+'\',\''+o.val+'\','+i+')">'+'<div class="rdot"><div class="ri"></div></div><span>'+o.label+'</span></button>'; });
  h+='</div><div class="arow"><button class="bp" id="rg_'+key+'" onclick="rGo(\''+key+'\')"'+(cur?'':' disabled')+'>Continue</button>'+bb()+'</div></div>';
  window._rc=window._rc||{}; window._rc[key]=cb;
  return h;
}
window.pR=function(k,v,i){
  S.answers[k]=v;
  var c=document.getElementById('ro_'+k);
  if(c){c.querySelectorAll('.opt').forEach(function(b){b.classList.remove('sel')});c.querySelectorAll('.opt')[i].classList.add('sel');}
  var b=document.getElementById('rg_'+k); if(b) b.removeAttribute('disabled');
};
window.rGo=function(k){ var v=S.answers[k]; if(!v)return; var cb=(window._rc||{})[k]; if(cb) cb(v); };

// Checkbox step
function checkStep(lbl,q,notes,key,opts,cl,cb){
  var sel=S.answers[key]||[];
  var h='<div class="sc"><div class="slabel">'+lbl+'</div><div class="sq">'+q+'</div>';
  notes.forEach(function(n){ h+='<div class="snote'+(n.cls?' '+n.cls:'')+'">'+(n.badge?n24()+' ':'')+n.text+'</div>'; });
  h+='<div class="copts">';
  opts.forEach(function(o){ var c=sel.indexOf(o.val)>=0?' chk':''; h+='<button class="copt'+c+'" onclick="tC(\''+key+'\',\''+o.val+'\')">'+'<div class="cbox">'+(sel.indexOf(o.val)>=0?'&#10003;':'')+'</div><span>'+o.label+(o.new?' '+n24():'')+'</span></button>'; });
  h+='</div><div class="mn">Select all that apply</div>';
  h+='<div class="arow"><button class="bp" onclick="cGo(\''+key+'\')">'+(cl||'Continue')+'</button>'+bb()+'</div></div>';
  window._cc=window._cc||{}; window._cc[key]=cb;
  return h;
}
window.tC=function(k,v){ if(!S.answers[k])S.answers[k]=[]; var arr=S.answers[k],i=arr.indexOf(v); if(i>=0)arr.splice(i,1);else arr.push(v); render(); };
window.cGo=function(k){ var cb=(window._cc||{})[k]; if(cb) cb(S.answers[k]||[]); };

// Summary row
function sRow(k,v,cls){ var cv=cls||''; return '<div class="sum-row"><div class="sum-k">'+k+'</div><div class="sum-v '+cv+'">'+v+'</div></div>'; }
// Result card
function rCard(cls,ico,title,ichd,body,rows){
  var h='<div class="rc r-'+cls+'"><div class="richd">'+ichd+'</div><div class="rtitle"><div class="rico">'+ico+'</div>'+title+'</div><div class="rbody">'+body+'</div></div>';
  if(rows&&rows.length){
    h+='<div class="sum-card"><div class="sum-title">Evidence Summary</div>';
    rows.forEach(function(r){ h+=sRow(r.k,r.v,r.c); });
    h+='</div>';
  }
  return h;
}

// ═══════════════════════════════════════════
// RENDER ROUTER
// ═══════════════════════════════════════════
function render(){
  upP();
  var m=document.getElementById('main');
  switch(S.phase){
    case 'prereq':         m.innerHTML=bread('prereq')+phPrereq(); break;
    case 'age_comorbid':   m.innerHTML=bread('age_comorbid')+phAgeComorbid(); break;
    case 'presentation':   m.innerHTML=bread('presentation')+phPresentation(); break;
    case 'attacks':        m.innerHTML=bread('attacks')+phAttacks(); break;
    case 'mri_dit':        m.innerHTML=bread('mri_dit')+phMriDit(); break;
    case 'dis_locations':  m.innerHTML=bread('dis_locations')+phDisLocations(); break;
    case 'optic_nerve':    m.innerHTML=bread('optic_nerve')+phOpticNerve(); break;
    case 'csf_lp':         m.innerHTML=bread('csf_lp')+phCsfLp(); break;
    case 'csf_ocb':        m.innerHTML=bread('csf_ocb')+phCsfOcb(); break;
    case 'csf_kflc':       m.innerHTML=bread('csf_kflc')+phCsfKflc(); break;
    case 'cvs':            m.innerHTML=bread('cvs')+phCvs(); break;
    case 'prl':            m.innerHTML=bread('prl')+phPrl(); break;
    case 'exclusion':      m.innerHTML=bread('exclusion')+phExclusion(); break;
    case 'ppms_worsening': m.innerHTML=bread('ppms_worsening')+phPpmsWorsening(); break;
    case 'ppms_criteria':  m.innerHTML=bread('ppms_criteria')+phPpmsCriteria(); break;
    case 'result':         phResult(m); break;
    case 'atypical':       phAtypical(m); break;
    default: m.innerHTML='<p>Unknown phase</p>';
  }
}

// ═══════════════════════════════════════════
// PHASES
// ═══════════════════════════════════════════

function phPrereq(){
  return radioStep('Step 1 — Clinical Syndrome','What is the presenting clinical syndrome?',
    'The 2024 McDonald Criteria apply to patients with a typical demyelinating event or progressive neurological worsening. Atypical features (complete spinal cord syndrome, bilateral optic neuritis at onset, area postrema syndrome, meningeal enhancement, CSF pleocytosis >50) should prompt broadening the differential — particularly NMOSD and MOGAD.',
    'warn','prereq',[
      {val:'cis',    label:'Clinically Isolated Syndrome (CIS) — first demyelinating episode with objective evidence'},
      {val:'ris',    label:'Radiologically Isolated Syndrome (RIS) — incidental MRI findings, no clinical symptoms'},
      {val:'relapse',label:'Relapsing presentation — ≥1 prior attack with objective evidence'},
      {val:'prog',   label:'Progressive neurological worsening — possible PPMS'},
      {val:'atypical',label:'Atypical presentation — features not consistent with typical MS demyelination'}
    ],function(v){
      S.answers.prereq=v;
      if(v==='atypical') advance('atypical');
      else if(v==='prog') advance('ppms_worsening');
      else advance('age_comorbid');
    });
}

function phAgeComorbid(){
  return checkStep('Step 2 — Age & Comorbidities',
    'Are any of the following present?',

function phResult(m){
  var a=S.answers;
  document.getElementById('pFill').style.width='100%';
  document.getElementById('pLabel').textContent='Complete';

  if(S.phase!=='result'){ S.phase='result'; }

  // ── Compute biomarker status ──────────────
  var isRIS = a.prereq==='ris';
  var isProg = a.prereq==='prog';

  // CSF positive = OCBs positive OR κFLC positive (≥6.1 index or borderline treated as positive for DIS substitution discussion)
  var ocbPos = a.csf_ocb==='pos';
  var kflcPos = a.csf_kflc==='pos_high';
  var kflcBorder = a.csf_kflc==='pos_border';
  var csfPos = ocbPos || kflcPos; // formally positive
  var csfBorderlinePos = ocbPos || kflcPos || kflcBorder;
  var csfDone = a.csf_lp==='yes';
  var cvsPos = a.cvs==='select6_pos';
  var prlPos = a.prl==='pos' || a.prl==='multi';
  var prlMulti = a.prl==='multi';

  // Optic nerve count
  var opticConfirmed = (a.dis_locations||[]).indexOf('optic')>=0 &&
    (a.optic_nerve||[]).filter(function(v){return v!=='none_optic';}).length>0;

  // DIS locations (MRI + optic nerve)
  var mriLocs = (a.dis_locations||[]).filter(function(v){return v!=='optic';});
  var disLocCount = mriLocs.length + (opticConfirmed?1:0) + (csfPos?1:0); // CSF adds 1 virtual location
  var disMet = false;
  var disReason = '';

  var pres = a.presentation;
  if(pres==='2att2les'){ disMet=true; disReason='Clinically met (≥2 attacks, ≥2 lesions)'; }
  else if(disLocCount>=2){ disMet=true; disReason='MRI: '+disLocCount+' location(s)'+(csfPos?' incl. CSF substitution':'')+(opticConfirmed?' incl. optic nerve':''); }
  else { disReason='Not met — '+disLocCount+'/2 location(s) confirmed'; }

  // DIT
  var ditMet = false;
  var ditReason = '';
  if(pres==='2att2les'||pres==='2att1les'){ ditMet=true; ditReason='Clinically met (≥2 attacks)'; }
  else if(a.mri_dit==='yes'){ ditMet=true; ditReason='MRI DIT (Gd+/non-enhancing or new T2 on follow-up)'; }
  else if(csfPos && disMet){
    // 2024: CSF+ substitutes for DIT when DIS is met
    ditMet=true; ditReason='CSF positivity substituting for DIT '+(kflcPos&&!ocbPos?'(κFLC index ≥6.1)':ocbPos&&!kflcPos?'(OCBs)':'(OCBs + κFLC)');
  }
  if(!ditMet) ditReason='Not met — no second attack, no MRI DIT evidence, no positive CSF';

  // Age/comorbidity specificity requirement
  var ageComorbid = (a.age_comorbid||[]).filter(function(v){return v!=='none';}).length>0;
  var specificityMet = false;
  var specificityItems = [];
  if(!ageComorbid){ specificityMet=true; specificityItems=['Not required — age <50, no significant comorbidities']; }
  else {
    var hasSpinal = (a.dis_locations||[]).indexOf('spinal')>=0;
    if(hasSpinal){ specificityMet=true; specificityItems.push('Classical spinal cord lesion present'); }
    if(csfPos){ specificityMet=true; specificityItems.push('Positive CSF ('+(ocbPos?'OCBs':'')+(ocbPos&&kflcPos?' + ':'')+(kflcPos?'κFLC ≥6.1':'')+')');}
    if(cvsPos){ specificityMet=true; specificityItems.push('Select-6 CVS positive');}
    if(!specificityMet) specificityItems=['Not confirmed — requires ≥1 of: spinal cord lesion, positive CSF (OCBs/κFLC), or Select-6 CVS'];
  }

  // Exclusions
  var exclDone=(a.exclusion||[]).length;
  var nmosdExcl=(a.exclusion||[]).indexOf('nmosd')>=0;
  var mogadExcl=(a.exclusion||[]).indexOf('mogad')>=0;
  var exclusionsOk = exclDone>=5 && nmosdExcl && mogadExcl;

  // ── PROGRESSIVE ───────────────────────────
  if(isProg){
    var progYear=a.ppms_worsening==='yes';
    var ppmsC=(a.ppms_criteria||[]).length;
    var diagMet=progYear && ppmsC>=2 && specificityMet && exclusionsOk;
    var html='<div class="sum-card"><div class="sum-title">PPMS Diagnostic Summary</div>';
    html+=sRow('≥1 year progressive worsening',progYear?'Yes':'No / insufficient',progYear?'yes':'no');
    html+=sRow('PPMS supporting criteria',ppmsC+'/3 met (need ≥2)',ppmsC>=2?'yes':'no');
    html+=sRow('CSF result',!csfDone?'Not performed':csfPos?'Positive — '+(ocbPos?'OCBs ':'')+(kflcPos?'κFLC ≥6.1':''):'Negative',!csfDone?'part':csfPos?'yes':'no');
    html+=sRow('CVS (Select-6)',a.cvs==='not_done'?'Not assessed':cvsPos?'Positive (Select-6)':'Negative',a.cvs==='not_done'?'part':cvsPos?'yes':'no');
    html+=sRow('PRL',a.prl==='nd'?'Not assessed':prlPos?'Positive (≥1 PRL)'+(prlMulti?' — ≥4 PRLs (higher disability risk)':''):'Negative',a.prl==='nd'?'part':prlPos?'yes':'no');
    html+=sRow('Specificity criteria (age/comorbid)',specificityItems.join('; '),specificityMet?'yes':'no');
    html+=sRow('AQP4-IgG / MOG-IgG excluded',nmosdExcl&&mogadExcl?'Both excluded':(!nmosdExcl?'AQP4-IgG not confirmed excluded':'')+(!mogadExcl?' MOG-IgG not confirmed excluded':''),nmosdExcl&&mogadExcl?'yes':'no');
    html+='</div>';

    if(!nmosdExcl||!mogadExcl){
      html+=rCard('red','!','AQP4-IgG and/or MOG-IgG not excluded','Priority',
        'NMOSD and MOGAD must be excluded before confirming PPMS. Both can present with progressive myelopathy.',[]); }

    if(diagMet){
      html+=rCard('green','✓','2024 McDonald Criteria for PPMS: FULFILLED','PPMS',
        'Progressive neurological worsening ≥1 year with ≥2 of 3 supporting criteria confirmed.',
        [{k:'Criteria met',v:ppmsC+'/3 PPMS criteria',c:'yes'},
         {k:'Specificity',v:specificityItems.join('; '),c:'yes'},
         {k:'Treatment',v:'Ocrelizumab or ofatumumab (approved for PPMS with active imaging). SEA on serial MRI = disease activity for eligibility.',c:''},
         {k:'Monitoring',v:'Baseline EDSS, 9HPT, T25FW, SDMT. MRI brain + spine as reference. Serial PRL count for progression risk.',c:''}]);
    } else if(!progYear){
      html+=rCard('red','✕','PPMS Criteria Not Met — Insufficient Duration','PPMS',
        'Less than 1 year of documented progressive worsening. Continue prospective documentation.',[]);
    } else if(ppmsC<2){
      html+=rCard('amber','?','PPMS Criteria Not Met — Insufficient Supporting Criteria','PPMS',
        'Progression criterion met but only '+ppmsC+'/3 supporting criteria.',
        [{k:'LP if not done',v:'OCBs / κFLC index — satisfies CSF criterion. κFLC index ≥6.1 is positive.',c:''},
         {k:'Spinal MRI',v:'≥2 T2 lesions satisfy spinal criterion.',c:''},
         {k:'CVS / PRL',v:'Select-6 CVS or ≥1 PRL can support diagnosis in appropriate clinical context.',c:''}]);
    } else if(!specificityMet){
      html+=rCard('amber','!','Age/Comorbidity Specificity Requirement Not Met','PPMS',
        'Age ≥50 or vascular comorbidities require ≥1 of: spinal cord lesion, positive CSF (OCBs/κFLC), or Select-6 CVS.',
        [{k:'Next step',v:'LP for OCBs + κFLC if not done; dedicated SWI for CVS assessment; spinal MRI if not performed',c:''}]);
    } else {
      html+=rCard('amber','!','Criteria Met — Exclusion Workup Incomplete','PPMS',
        'Address outstanding differentials (AQP4-IgG, MOG-IgG) before confirming PPMS.',[]);
    }
    html+=docNoteHTML(diagMet?'2024 McDonald Criteria for PPMS: FULFILLED':!progYear?'PPMS Criteria Not Met — Insufficient Duration':ppmsC<2?'PPMS Criteria Not Met — Insufficient Supporting Criteria ('+ppmsC+'/3)':!specificityMet?'Criteria Met — Age/Comorbidity Specificity Requirement Not Fulfilled':'Criteria Met — Exclusion Workup Incomplete', diagMet?'Primary Progressive MS (PPMS)':null);
    html+='<button class="bs" onclick="restart()" style="margin-top:8px">Restart Assessment</button>';
    m.innerHTML=html; return;
  }

  // ── RIS ───────────────────────────────────
  if(isRIS){
    var risDiagnosis = disMet && (csfPos || cvsPos || prlPos) && exclusionsOk;
    var html='<div class="sum-card"><div class="sum-title">RIS → MS Evaluation (2024) '+n24()+'</div>';
    html+=sRow('DIS (≥2 of 5 locations)',disMet?disReason:'Not met — '+disLocCount+'/2',disMet?'yes':'no');
    html+=sRow('Supporting biomarker (need ≥1)',
      (csfPos?'Positive CSF ':'')+(cvsPos?'Select-6 CVS ':'')+(prlPos?'≥1 PRL ':''),
      (csfPos||cvsPos||prlPos)?'yes':'no');
    html+=sRow('CSF (OCBs / κFLC)',!csfDone?'Not performed':csfPos?'Positive':'Negative',!csfDone?'part':csfPos?'yes':'no');
    html+=sRow('κFLC index',a.csf_kflc==='nd'||!csfDone?'Not assessed':kflcPos?'≥6.1 (positive)':kflcBorder?'4.0–6.0 (borderline)':'Negative',!csfDone||a.csf_kflc==='nd'?'part':kflcPos?'yes':kflcBorder?'part':'no');
    html+=sRow('CVS (Select-6)',a.cvs==='not_done'?'Not assessed':cvsPos?'Positive':'Negative',a.cvs==='not_done'?'part':cvsPos?'yes':'no');
    html+=sRow('PRL (≥1)',a.prl==='nd'?'Not assessed':prlPos?'Positive':'Negative',a.prl==='nd'?'part':prlPos?'yes':'no');
    html+=sRow('AQP4-IgG / MOG-IgG',nmosdExcl&&mogadExcl?'Both excluded':'Outstanding',nmosdExcl&&mogadExcl?'yes':'no');
    html+='</div>';
    if(!nmosdExcl||!mogadExcl){
      html+=rCard('red','!','AQP4-IgG and/or MOG-IgG not excluded','Priority action',
        'Must be excluded before applying McDonald criteria to RIS.',[]);}
    if(risDiagnosis){
      html+=rCard('green','✓','2024 McDonald Criteria Met — MS Diagnosis in RIS Context','RIS → MS (2024)',
        'DIS fulfilled (≥2 locations) AND at least one supportive biomarker confirmed. 2024 criteria permit MS diagnosis in RIS if these conditions are met.',
        [{k:'DIS',v:disReason,c:'yes'},
         {k:'Biomarker',v:(csfPos?'CSF positive ':'')+(cvsPos?'Select-6 CVS ':'')+(prlPos?'≥1 PRL':''),c:'yes'},
         {k:'Clinical note',v:'Patient was asymptomatic — document carefully. ~19% RIS → clinical MS within 2 years, 51% within 10 years.',c:''},
         {k:'DMT discussion',v:'Emerging evidence supports early DMT in biomarker-positive RIS — shared decision-making required.',c:''}]);
    } else if(!disMet){
      html+=rCard('amber','?','RIS — DIS Criteria Not Yet Met','RIS',
        'Fewer than 2 typical MS locations confirmed. Further MRI (repeat, dedicated sequences) or LP required.',
        [{k:'Next step',v:'Dedicated optic nerve MRI, SWI for CVS/PRL, spinal MRI if not performed; LP for OCBs + κFLC index.',c:''}]);
    } else {
      html+=rCard('amber','?','RIS — DIS Met, Supportive Biomarker Needed','RIS',
        'DIS criterion fulfilled but no confirmatory biomarker yet. LP and/or dedicated susceptibility MRI needed to qualify for MS diagnosis.',
        [{k:'LP for OCBs + κFLC',v:'If positive, RIS → MS criteria met.',c:''},
         {k:'CVS (Select-6)',v:'SWI or T2* sequences required.',c:''},
         {k:'PRL (≥1)',v:'Phase susceptibility sequence required.',c:''}]);
    }
    html+=docNoteHTML(risDiagnosis?'2024 McDonald Criteria Met — MS Diagnosis in RIS Context':!disMet?'RIS — DIS Criteria Not Yet Met':'RIS — DIS Met, Supportive Biomarker Needed', risDiagnosis?'MS diagnosed in RIS context (asymptomatic)':null);
    html+='<button class="bs" onclick="restart()" style="margin-top:8px">Restart Assessment</button>';
    m.innerHTML=html; return;
  }

  // ── CIS / RELAPSING MS ───────────────────
  var html='<div class="sum-card"><div class="sum-title">Diagnostic Summary — 2024 McDonald Criteria</div>';
  html+=sRow('DIT (Dissemination in Time)',ditReason,ditMet?'yes':'no');
  html+=sRow('DIS (Dissemination in Space)',disMet?disReason:'Not met — '+disLocCount+'/2',disMet?'yes':'no');
  if(opticConfirmed) html+=sRow('Optic nerve (5th DIS location)',
    (a.optic_nerve||[]).filter(function(v){return v!=='none_optic';}).join(', ').replace('mri_optic','MRI').replace('oct_rnfl','OCT RNFL').replace('oct_gcipl','OCT GCIPL').replace('vep','VEP'),
    'yes');
  html+=sRow('CSF OCBs',!csfDone?'LP not performed':ocbPos?'Positive (≥2 unique bands)':'Negative',!csfDone?'part':ocbPos?'yes':'no');
  html+=sRow('CSF κFLC index '+n24(),!csfDone||a.csf_kflc==='nd'?'Not assessed':kflcPos?'≥6.1 — Positive':kflcBorder?'4.0–6.0 — Borderline':'Negative — <4.0',!csfDone||a.csf_kflc==='nd'?'part':kflcPos?'yes':kflcBorder?'part':'no');
  html+=sRow('CVS — Select-6 '+n24(),a.cvs==='not_done'?'Not assessed':cvsPos?'Positive (Select-6)':'Negative',a.cvs==='not_done'?'part':cvsPos?'yes':'no');
  html+=sRow('Paramagnetic Rim Lesions '+n24(),a.prl==='nd'?'Not assessed':prlPos?'Positive (≥1 PRL)'+(prlMulti?' — ≥4 PRLs':''):'Negative',a.prl==='nd'?'part':prlPos?'yes':'no');
  if(ageComorbid) html+=sRow('Specificity requirement (age ≥50/comorbid)',specificityItems.join('; '),specificityMet?'yes':'no');
  html+=sRow('AQP4-IgG / MOG-IgG excluded',nmosdExcl&&mogadExcl?'Both excluded':'Outstanding',nmosdExcl&&mogadExcl?'yes':'no');
  html+=sRow('Exclusion workup',exclDone+'/8 items addressed',exclDone>=6?'yes':exclDone>=3?'part':'no');
  html+='</div>';

  // Priority: NMOSD/MOGAD alert
  if(!nmosdExcl||!mogadExcl){
    html+=rCard('red','!','AQP4-IgG and/or MOG-IgG Not Confirmed Excluded','Required',
      (!nmosdExcl?'<strong>AQP4-IgG</strong> — must be tested (serum, cell-based assay preferred over ELISA) before applying McDonald criteria. ':'')
      +(!mogadExcl?'<strong>MOG-IgG</strong> — must be tested (serum, FACS/cell-based assay) before applying McDonald criteria.':'')+
      '<br>Both NMOSD and MOGAD can fulfill MRI DIS/DIT criteria and mimic RRMS.',[]);
  }

  var diagMet = ditMet && disMet && specificityMet && exclusionsOk;

  if(diagMet){
    var msType = '';
    if(pres==='2att2les') msType='Clinically definite MS (≥2 attacks + ≥2 lesions)';
    else if(pres==='2att1les') msType='MS — DIT met clinically (≥2 attacks), DIS met by MRI';
    else if(pres==='1att2les') msType='MS — DIS met clinically (1 attack ≥2 lesions), DIT met by MRI';
    else msType='MS — DIT and DIS met by MRI/CSF/clinical combination';
    if(isRIS) msType='MS — diagnosed in RIS context with DIS + supportive biomarker';

    html+=rCard('green','✓','2024 McDonald Criteria for MS: FULFILLED','McDonald 2024',
      '<strong>Classification:</strong> '+msType,
      [{k:'Positive biomarkers',v:[ocbPos?'OCBs':'',kflcPos?'κFLC ≥6.1':'',kflcBorder?'κFLC borderline (4.0–6.0)':'',cvsPos?'Select-6 CVS':'',prlPos?'PRL ≥1'+(prlMulti?' (≥4 — monitor for disability progression)':''):'',opticConfirmed?'Optic nerve (5th DIS location)':''].filter(Boolean).join(' · '),c:'yes'},
       {k:'Acute Rx / DMT',v:'Initiate shared DMT decision. Baseline MRI brain + spine before or within 3–6 months of starting.',c:''},
       {k:'Disability baseline',v:'EDSS, SDMT, 9HPT, T25FW. Document PRL count (≥4 = higher disability risk).',c:''},
       {k:'Monitoring',v:'Annual MRI (brain ± spine); reassess CSF biomarkers not needed routinely once diagnosed; serial SDMT for cognitive tracking.',c:''}]);

  } else if(ditMet && disMet && !specificityMet){
    html+=rCard('amber','!','Criteria Met — Age/Comorbidity Specificity Requirement Not Fulfilled','McDonald 2024',
      'DIT and DIS are met, but patient is age ≥50 or has vascular/migraine comorbidities. At least one specificity-conferring feature is required to confirm MS in this population.',
      [{k:'Options',v:'(1) Classical spinal cord lesion on MRI, (2) Positive CSF: OCBs or κFLC index ≥6.1, (3) Select-6 CVS positivity on SWI/T2*',c:'part'},
       {k:'Clinical context',v:'This requirement specifically addresses the higher rate of non-specific white matter lesions in vascular disease and migraine. CVS is particularly discriminating in this setting.',c:''}]);

  } else if(ditMet && disMet && !exclusionsOk){
    html+=rCard('amber','!','Criteria Met — Exclusion Workup Incomplete','McDonald 2024',
      'DIT and DIS are technically fulfilled. Address outstanding differentials before confirming MS.',
      [{k:'Priority',v:(!nmosdExcl?'AQP4-IgG testing required. ':'')+(!mogadExcl?'MOG-IgG testing required.':''),c:'part'}]);

  } else if(!ditMet && disMet){
    html+=rCard('amber','?','DIS Met — DIT Not Yet Demonstrated','McDonald 2024',
      'Dissemination in space is confirmed. DIT can be met by:',
      [{k:'MRI follow-up',v:'New T2 or Gd+ lesion on any follow-up scan — no minimum interval required.',c:''},
       {k:'CSF (preferred)',v:'Positive OCBs or κFLC index ≥6.1 substitutes for DIT when DIS is met — consider LP now.',c:''},
       {k:'Clinical',v:'Second attack in a different location meets DIT clinically.',c:''},
       {k:'CIS classification',v:'Classify as CIS pending further assessment. Risk of conversion to MS: ~50–70% within 10 years with DIS lesions present.',c:''}]);

  } else if(ditMet && !disMet){
    html+=rCard('amber','?','DIT Met — DIS Not Yet Fulfilled','McDonald 2024',
      'Dissemination in time is confirmed. DIS can be completed with:',
      [{k:'MRI locations',v:disLocCount+'/2 typical locations confirmed. Need ≥2 of 5 (periventricular, cortical/juxtacortical, infratentorial, spinal cord, optic nerve).',c:''},
       {k:'CSF substitution',v:'Positive OCBs or κFLC ≥6.1 counts as 1 DIS location. If 1 MRI location present + positive CSF → DIS met.',c:''},
       {k:'Optic nerve MRI',v:'Dedicated fat-sat orbital MRI; or OCT RNFL intereye diff ≥6 μm / GCIPL ≥4 μm; or VEP delayed P100 ≥2.5 SD.',c:''},
       {k:'CVS / PRL',v:'Select-6 CVS or ≥1 PRL can support specificity but do not independently replace DIS location count.',c:''}]);

  } else {
    html+=rCard('red','✕','2024 McDonald Criteria: NOT Fulfilled','McDonald 2024',
      'Neither DIT nor DIS are met.',
      [{k:'DIT',v:ditReason,c:'no'},
       {k:'DIS',v:disReason,c:'no'},
       {k:'Next steps',v:'Repeat MRI in 3–6 months; LP for OCBs + κFLC index (can substitute for both 1 DIS location and DIT); optic nerve MRI/OCT/VEP if not performed.',c:''}]);
  }

  // κFLC borderline note
  if(kflcBorder && !kflcPos){
    html+='<div class="rc r-blue"><div class="richd">κFLC Note</div><div class="rtitle"><div class="rico">i</div>κFLC Index Borderline (4.0–6.0)</div>'
    +'<div class="rbody">Borderline κFLC does not formally fulfill the ≥6.1 threshold for CSF positivity per 2024 criteria. Consider: (1) repeat LP, (2) ensure paired serum sample was collected, (3) verify assay platform (turbidimetric/nephelometric preferred — not manual ELISA). If OCBs are also negative, CSF does not substitute for DIS or DIT in this case.</div></div>';
  }

  // PRL prognostic note
  if(prlMulti){
    html+='<div class="rc r-purple"><div class="richd">Prognostic Note</div><div class="rtitle"><div class="rico">!</div>≥4 Paramagnetic Rim Lesions — Higher Disability Risk</div>'
    +'<div class="rbody">Published data associate ≥4 PRLs with greater neurological disability over time. Document PRL count at baseline for longitudinal comparison. This does not change the diagnosis but may influence DMT selection discussions.</div></div>';
  }

  // Determine verdict string for doc note
  var verdictStr='';
  if(diagMet){ var msType=''; if(pres==='2att2les') msType='Clinically definite MS (≥2 attacks + ≥2 lesions)'; else if(pres==='2att1les') msType='MS — DIT met clinically (≥2 attacks), DIS met by MRI'; else if(pres==='1att2les') msType='MS — DIS met clinically, DIT met by MRI'; else msType='MS — DIT and DIS met by MRI/CSF/clinical combination'; if(isRIS) msType='MS diagnosed in RIS context'; verdictStr='2024 McDonald Criteria for MS: FULFILLED — '+msType; }
  else if(ditMet&&disMet&&!specificityMet) verdictStr='Criteria Met — Age/Comorbidity Specificity Requirement Not Fulfilled';
  else if(ditMet&&disMet&&!exclusionsOk) verdictStr='Criteria Met — Exclusion Workup Incomplete';
  else if(!ditMet&&disMet) verdictStr='DIS Met — DIT Not Yet Demonstrated (CIS)';
  else if(ditMet&&!disMet) verdictStr='DIT Met — DIS Not Yet Fulfilled';
  else verdictStr='2024 McDonald Criteria: NOT Fulfilled — DIT and DIS not met';

  html+=docNoteHTML(verdictStr, diagMet?verdictStr:null);
  html+='<button class="bs" onclick="restart()" style="margin-top:8px">Restart Assessment</button>';
  m.innerHTML=html;
}

window.back=back;
window.restart=restart;

// ── DOCUMENTATION NOTE ──────────────────────────────────────────
window.toggleDocNote = function(){
  var el=document.getElementById('doc-note-body');
  if(el) el.classList.toggle('open');
};

function buildDocNote(verdict, subtype){
  var a=S.answers;
  var isRIS=a.prereq==='ris', isProg=a.prereq==='prog';
  var ocbPos=a.csf_ocb==='pos', kflcPos=a.csf_kflc==='pos_high', kflcBorder=a.csf_kflc==='pos_border';
  var csfDone=a.csf_lp==='yes', csfPos=ocbPos||kflcPos;
  var cvsPos=a.cvs==='select6_pos', prlPos=a.prl==='pos'||a.prl==='multi', prlMulti=a.prl==='multi';
  var opticConfirmed=(a.dis_locations||[]).indexOf('optic')>=0&&(a.optic_nerve||[]).filter(function(v){return v!=='none_optic';}).length>0;
  var mriLocs=(a.dis_locations||[]).filter(function(v){return v!=='optic';});
  var disLocCount=mriLocs.length+(opticConfirmed?1:0)+(csfPos?1:0);
  var exclList=a.exclusion||[];
  var ageComorbid=(a.age_comorbid||[]).filter(function(v){return v!=='none';});

  var presLabels={'2att2les':'≥2 attacks + ≥2 lesions','2att1les':'≥2 attacks + 1 lesion (+ historical evidence)','1att2les':'1 attack + ≥2 lesions','1att1les':'1 attack + 1 lesion (CIS)'};
  var exclLabels={'nmosd':'NMOSD (AQP4-IgG negative)','mogad':'MOGAD (MOG-IgG negative)','vasculitis':'CNS vasculitis / SLE / Sjögren','sarcoid':'Neurosarcoidosis','infection':'Infectious causes (Lyme, syphilis, HIV)','genetic':'Hereditary leukodystrophies','b12':'Nutritional/metabolic (B12, copper)','structural':'Structural causes (spondylosis, Chiari)'};
  var opticLabels={'mri_optic':'Orbital MRI (T2 lesion)','oct_rnfl':'OCT RNFL intereye diff ≥6 μm','oct_gcipl':'OCT GCIPL intereye diff ≥4 μm','vep':'VEP delayed P100 ≥2.5 SD'};
  var disLabels={'periventricular':'Periventricular','cortical':'Cortical/juxtacortical','infratentorial':'Infratentorial','spinal':'Spinal cord','optic':'Optic nerve'};
  var ppmsLabels={'brain':'≥1 T2 brain lesion (typical MS location)','spine':'≥2 T2 spinal cord lesions','csf':'Positive CSF (OCBs and/or κFLC ≥6.1)'};
  var acLabels={'age50':'Age ≥50','migraine':'Migraine','vascular':'Vascular risk factors / WMH'};

  var n = 'NEUROIMMUNOLOGY CONSULTATION\n2024 McDonald Criteria Assessment\nThompson AJ et al. Lancet Neurol 2024\nDate: '+new Date().toLocaleDateString()+'\n';
  n += '\nPRESENTATION TYPE: '+(isRIS?'Radiologically Isolated Syndrome (RIS)':isProg?'Progressive MS pathway':'Relapsing / CIS pathway')+'\n';

  if(!isRIS && !isProg){
    n+='\nCLINICAL ATTACK EVIDENCE\n  '+((presLabels[a.presentation])||'Not specified')+'\n';
    if(a.mri_dit) n+='  MRI DIT: '+(a.mri_dit==='yes'?'Demonstrated (Gd+/non-enhancing T2 or new T2 on follow-up)':'Not demonstrated')+'\n';
  }

  if(isProg){
    n+='\nPROGRESSIVE WORSENING: '+(a.ppms_worsening==='yes'?'≥1 year documented':'Insufficient duration')+'\n';
    var ppmsC=(a.ppms_criteria||[]);
    n+='PPMS SUPPORTING CRITERIA ('+ppmsC.length+'/3):\n';
    if(ppmsC.length>0) ppmsC.forEach(function(k){ n+='  - '+(ppmsLabels[k]||k)+'\n'; });
    else n+='  None confirmed\n';
  }

  var disMRI=mriLocs.map(function(k){return disLabels[k]||k;});
  n+='\nDISSEMINATION IN SPACE (DIS)\n';
  n+='  MRI locations ('+mriLocs.length+'): '+(disMRI.length>0?disMRI.join(', '):'None')+'\n';
  if(opticConfirmed){
    var opticMethods=(a.optic_nerve||[]).filter(function(v){return v!=='none_optic';}).map(function(k){return opticLabels[k]||k;});
    n+='  Optic nerve: Confirmed — '+opticMethods.join(', ')+'\n';
  } else n+='  Optic nerve: Not confirmed\n';
  n+='  CSF as DIS substitute: '+(csfPos?'Yes (counts as 1 location)':'No')+'\n';
  n+='  Total DIS location count: '+disLocCount+'/5'+(disLocCount>=2?' — MET':'— NOT MET')+'\n';

  n+='\nCSF ANALYSIS\n';
  if(!csfDone){ n+='  Lumbar puncture: Not performed\n'; }
  else{
    n+='  Lumbar puncture: Performed\n';
    n+='  OCBs: '+(a.csf_ocb==='pos'?'Positive (≥2 unique IgG bands)':a.csf_ocb==='neg'?'Negative':'Not done')+'\n';
    n+='  κFLC index: '+(kflcPos?'Positive — ≥6.1':kflcBorder?'Borderline — 4.0–6.0':a.csf_kflc==='neg'?'Negative — <4.0':'Not measured')+'\n';
    n+='  Intrathecal IgG synthesis: '+(csfPos?'Confirmed':'Not confirmed'+(kflcBorder?' (borderline κFLC — does not formally fulfill ≥6.1 threshold)':''))+'\n';
  }

  n+='\nMRI BIOMARKERS (2024 CRITERIA)\n';
  n+='  Central Vein Sign (Select-6): '+(a.cvs==='select6_pos'?'POSITIVE — Select-6 fulfilled':a.cvs==='select6_neg'?'Negative — Select-6 not fulfilled':'Not assessed (SWI/T2* not performed)')+'\n';
  n+='  Paramagnetic Rim Lesions: '+(prlMulti?'POSITIVE — ≥4 PRLs present (higher disability risk — document count)':prlPos?'POSITIVE — ≥1 PRL identified':a.prl==='neg'?'Negative — no PRLs identified':'Not assessed (susceptibility sequences not performed)')+'\n';

  if(ageComorbid.length>0){
    n+='\nAGE / COMORBIDITY SPECIFICITY REQUIREMENT (ACTIVE)\n';
    n+='  Risk factors: '+ageComorbid.map(function(k){return acLabels[k]||k;}).join(', ')+'\n';
    var specItems=[];
    if((a.dis_locations||[]).indexOf('spinal')>=0) specItems.push('Classical spinal cord lesion present');
    if(csfPos) specItems.push('Positive CSF ('+(ocbPos?'OCBs':'')+(ocbPos&&kflcPos?' + ':'')+(kflcPos?'κFLC ≥6.1':'')+')')
    if(cvsPos) specItems.push('Select-6 CVS positive');
    n+='  Specificity criteria met: '+(specItems.length>0?specItems.join('; '):'None — criteria NOT fulfilled')+'\n';
  }

  n+='\nEXCLUSION OF ALTERNATIVE DIAGNOSES ('+exclList.length+'/8 addressed)\n';
  if(exclList.length>0) exclList.forEach(function(k){ n+='  ✓ '+(exclLabels[k]||k)+'\n'; });
  var outstanding=['nmosd','mogad','vasculitis','sarcoid','infection','genetic','b12','structural'].filter(function(k){return exclList.indexOf(k)<0;});
  if(outstanding.length>0) n+='  Outstanding: '+outstanding.map(function(k){return exclLabels[k]||k;}).join('; ')+'\n';

  n+='\n2024 McDONALD CRITERIA — FINAL CLASSIFICATION\n'+verdict+'\n';
  if(subtype) n+='Classification: '+subtype+'\n';

  n+='\nRef: Thompson AJ, Banwell BL, Barkhof F, et al. Diagnosis of multiple sclerosis: 2024 revisions of the McDonald criteria. Lancet Neurol. 2024. DOI: 10.1016/S1474-4422(24)00400-X';
  return n;
}

function docNoteHTML(verdict, subtype){
  return '<button class="doc-tog" onclick="toggleDocNote()">▼ Documentation Note</button>'
    +'<div class="doc-body" id="doc-note-body">'+buildDocNote(verdict, subtype)+'</div>';
}

render();

</script>
